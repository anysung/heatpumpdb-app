<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Complete F-Gas Rulebook for Heat Pumps — HeatPump DataBase Europe Special Report, October 2026</title>
<meta name="description" content="EU Regulation 2024/573 in one document: every refrigerant, every size, every date to 2050 — and what changes in five markets.">
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: the monthly Special Report shell (dark navy stage, white 16:9 pages, colour rail on the left edge),
   with HeatPump DB identity colours in place of the old mint: brand red over Action Blue on the rail, blue kickers.
   Single deliberate dark look for the frame; the pages are print documents and stay light. */
:root{
  color-scheme:dark;
  --stage:#071731; --stage-2:#030b19; --stage-line:rgba(255,255,255,.1); --stage-fg:#ffffff; --stage-muted:#a9b7cb;
  --ink:#1d1d1f; --ink-80:#333333; --muted:#6e7a8a; --paper:#ffffff; --parchment:#f5f5f7; --hair:#e3e7ee; --hair-soft:#eef1f5;
  --blue:#0066cc; --blue-tint:#e8f1fb; --blue-mid:#9cc3ec;
  --red:#e0452c; --red-mid:#f2a395; --red-tint:#fdece8; --red-ink:#b3321c;
  --font:"Inter",ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
html,body{background:var(--stage)}
body{background:radial-gradient(circle at 15% 12%,#163c6a 0,var(--stage) 38%,var(--stage-2) 100%) fixed;color:var(--stage-fg);font-family:var(--font);-webkit-font-smoothing:antialiased;margin:0}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:14px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:rgba(3,11,25,.82);backdrop-filter:blur(14px);border-bottom:1px solid var(--stage-line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--stage-2)}
.topbar img{height:22px;display:block}
.topbar .ed{font-size:12px;font-weight:700;color:var(--stage-muted);border-left:1px solid rgba(255,255,255,.16);padding-left:14px}
.topbar .draft{margin-left:auto;font-size:11px;font-weight:700;letter-spacing:.06em;color:#ffcfc6;border:1px solid rgba(224,69,44,.55);border-radius:999px;padding:5px 10px}
.wrap{max-width:1360px;margin:0 auto;padding-block:26px 70px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:34px}
.intro{display:grid;gap:8px;max-width:820px}
.intro h1{margin:0;font-size:30px;font-weight:800;letter-spacing:-.03em;text-wrap:balance}
.intro p{margin:0;font-size:14.5px;line-height:1.6;color:var(--stage-muted)}
.intro p b{color:#fff;font-weight:600}
.toc{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.toc a{font-size:12px;font-weight:600;color:#dce6f3;text-decoration:none;border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:6px 11px}
.toc a:hover,.toc a:focus-visible{background:rgba(255,255,255,.1);outline:none}
.item{display:grid;gap:10px;scroll-margin-top:70px}
.cap{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline}
.cap .no{font-size:11px;font-weight:800;letter-spacing:.1em;color:#fff;background:var(--blue);border-radius:6px;padding:3px 7px}
.cap .no.new{background:var(--red)}
.cap h2{margin:0;font-size:17px;font-weight:700;letter-spacing:-.01em}
.cap .axes{font-size:12.5px;color:var(--stage-muted)}
.stage{width:100%;min-width:0}
.scaler{transform-origin:0 0}

/* ───────── report page ───────── */
.page{width:1280px;height:720px;background:var(--paper);color:var(--ink);font-family:var(--font);position:relative;overflow:hidden;border-radius:18px;
  display:grid;grid-template-rows:auto 1fr auto;padding:28px 44px 18px 52px;box-sizing:border-box}
.page *{box-sizing:border-box}
.page table{color:var(--ink);font-family:var(--font);font-size:14px}
.page::before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:linear-gradient(var(--red) 0 50%,var(--blue) 50% 100%)}
.ph{display:grid;grid-template-columns:1fr auto;gap:8px 24px;align-items:start;padding-bottom:12px}
.kicker{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--blue)}
.pageno{font-size:12px;color:#7d8ca2;font-variant-numeric:tabular-nums;text-align:right}
.title{grid-column:1/-1;font-size:38px;line-height:1.04;font-weight:800;letter-spacing:-.035em;margin:2px 0 0;text-wrap:balance;max-width:1120px}
.dek{grid-column:1/-1;font-size:15px;line-height:1.5;color:#44556e;margin:6px 0 0;max-width:1080px}
.dek b{font-weight:700;color:var(--ink)}
.pb{min-height:0;display:flex;flex-direction:column;gap:10px}
.pf{display:flex;align-items:center;gap:10px;padding-top:10px;font-size:10px;color:#617087;line-height:1.4}
.pf .sl{font-size:10px;font-weight:800;letter-spacing:.14em;color:#7d8ca2;flex:none}
.pf .chip{border:1px solid var(--hair);border-radius:999px;padding:4px 9px;color:var(--ink-80);white-space:nowrap}
.pf .note{flex:1;min-width:0;color:#7d8ca2}
.pf .brand{display:flex;align-items:center;gap:8px;flex:none;font-weight:700;color:#617087}
.pf .badge{background:var(--ink);border-radius:6px;padding:4px 8px;display:flex}
.pf .badge img{height:11px;display:block}
.pf .brand b{color:var(--ink);font-weight:800}

/* legends */
.legend{display:flex;gap:14px;align-items:center;font-size:11px;color:var(--ink-80);flex-wrap:wrap}
.lg{display:flex;align-items:center;gap:6px;white-space:nowrap}
.sw{width:20px;height:12px;border-radius:3px;display:inline-block}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.hint{font-size:11.5px;color:var(--muted)}

/* ── matrix ── */
.mx{width:100%;border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums;table-layout:fixed}
.mx th,.mx td{padding:0}
.mx thead th{font-size:10.5px;font-weight:600;color:var(--ink-80);text-align:center;vertical-align:bottom;padding:0 4px 6px;line-height:1.3}
.mx thead tr.seg th{font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;padding:0 4px 5px}
.mx thead tr.seg th.res,.mx thead tr.seg th.com{border-bottom:2px solid var(--ink)}
.mx thead th .cp{display:block;font-size:13px;color:var(--ink);font-weight:700;letter-spacing:-.1px}
.mx thead th.l{text-align:left;padding-left:0}
.mx tbody td{height:27px;border-bottom:1px solid var(--hair-soft);vertical-align:middle}
td.cls{vertical-align:middle;border-bottom:1px solid var(--hair) !important;padding-right:8px !important}
td.cls span{display:block;white-space:nowrap;font-size:9.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);line-height:1.3}
tr.g-first td{border-top:1px solid var(--hair)}
.ref{font-weight:800;font-size:15px;letter-spacing:-.2px}
.gwp{font-size:12px;color:var(--ink-80);text-align:right;padding-right:14px !important}
.cell{margin:2px 3px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;letter-spacing:-.1px}
.c-ended{background:var(--ink);color:#fff}
.c-2026{background:var(--red);color:#fff}
.c-later{background:var(--red-tint);color:var(--red-ink)}
.c-open{background:var(--parchment);color:#8a94a3;font-weight:400}
.db{font-size:12px;color:var(--ink-80);text-align:right}
.db b{color:var(--ink);font-weight:700}
.nat{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--hair)}
.nat > div{padding:8px 12px 0 0;display:grid;grid-template-columns:auto 1fr;gap:3px 8px;align-items:start}
.nat > div + div{padding-left:12px;border-left:1px solid var(--hair-soft)}
.nat img{width:22px;display:block;margin-top:1px}
.nat .cn{font-size:11.5px;font-weight:700}
.nat .tx{grid-column:1/-1;font-size:10.5px;line-height:1.4;color:var(--ink-80)}
.nat .tx b{color:var(--red-ink);font-weight:700}

/* ── timeline ── */
.tl{display:grid;grid-template-columns:160px 1fr 250px;gap:0 22px;min-height:0}
.tl-years{display:grid;grid-template-columns:repeat(12,1fr);font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums;height:18px;align-items:end}
.tl-years span{border-left:1px solid var(--hair);padding-left:4px;line-height:1}
.tl-grp{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);height:24px;display:flex;align-items:flex-end;padding-bottom:4px;border-bottom:2px solid var(--ink)}
.tl-row-l{height:47px;display:flex;flex-direction:column;justify-content:center;border-bottom:1px solid var(--hair-soft)}
.tl-row-l .cp{font-size:15px;font-weight:800;letter-spacing:-.2px}
.tl-row-l .typ{font-size:11px;color:var(--muted)}
.tl-row-c{height:47px;position:relative;border-bottom:1px solid var(--hair-soft);display:grid;grid-template-rows:repeat(4,1fr);padding:4px 0}
.lane{position:relative}
.bar{position:absolute;left:0;top:1.5px;bottom:1.5px;border-radius:3px}
.bar.open{border-radius:3px 0 0 3px;clip-path:polygon(0 0,calc(100% - 6px) 0,100% 50%,calc(100% - 6px) 100%,0 100%)}
.bar.k-hi{background:var(--ink)} .bar.k-mid{background:var(--red)} .bar.k-low{background:var(--red-mid)} .bar.k-nat{background:var(--blue)}
.bar .yl{position:absolute;left:calc(100% + 5px);top:50%;transform:translateY(-50%);font-size:9.5px;font-weight:700;color:var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums}
.vline{position:absolute;top:0;bottom:0;width:0;border-left:1.5px solid var(--ink);z-index:2}
.vline.today{border-left:1.5px dashed var(--blue)}
.vlabel{position:absolute;top:-31px;font-size:9.5px;font-weight:700;white-space:nowrap;padding:0 5px;z-index:3;line-height:1}
.vlabel.l{transform:translateX(-100%);text-align:right}
.tl-key{display:grid;gap:9px;padding-top:24px}
.key-item{display:grid;grid-template-columns:24px 1fr;gap:2px 9px;align-items:start}
.key-item .sw{width:24px;height:10px;margin-top:4px}
.key-item .kt{font-size:12px;font-weight:700}
.key-item .kr{grid-column:2;font-size:11px;color:var(--ink-80);line-height:1.45}
.share{display:grid;gap:7px;padding-top:12px;border-top:1px solid var(--hair-soft);margin-top:4px}
.share-h{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.share-row{display:grid;grid-template-columns:76px 1fr;gap:8px;align-items:center;font-size:11px}
.stack{display:flex;height:12px;border-radius:3px;overflow:hidden}
.stack i{display:block;height:100%}
.share-n{grid-column:2;font-size:10px;color:var(--muted);margin-top:-3px;font-variant-numeric:tabular-nums}

/* ── year × refrigerant calendar ── */
.cal{width:100%;border-collapse:separate;border-spacing:3px;table-layout:fixed;font-variant-numeric:tabular-nums}
.cal th{font-size:11px;font-weight:700;color:var(--ink-80);padding:0 0 3px}
.cal th.yr27{color:var(--red)}
.cal td{height:30px;border-radius:5px;text-align:center;font-size:12.5px;font-weight:700}
.cal td.rf{text-align:left;font-size:14px;font-weight:800;padding-left:2px}
.cal td.gw{text-align:right;font-size:11px;font-weight:400;color:var(--muted);padding-right:8px}
.cal td.chg{outline:2px solid var(--ink);outline-offset:-2px}
.cal .sep td{height:6px}
.o7{background:var(--blue-tint);color:var(--blue)} .o5{background:#f3ece9;color:var(--red-ink)} .o3{background:var(--red-tint);color:var(--red-ink)} .o1{background:var(--red-mid);color:#5a1608} .o0{background:var(--ink);color:#fff}

/* ── milestones year × capacity ── */
.ms{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed}
.ms th{font-size:10.5px;font-weight:600;color:var(--ink-80);text-align:left;padding:0 8px 6px;vertical-align:bottom;line-height:1.3}
.ms th .cp{display:block;font-size:13px;font-weight:700;color:var(--ink)}
.ms thead tr.seg th{font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;padding:0 8px 5px;border-bottom:2px solid var(--ink)}
.ms thead tr.seg th.blank{border-bottom:0}
.ms td{border-bottom:1px solid var(--hair-soft);padding:3px 4px;vertical-align:middle;height:38px}
.ms td.y{font-size:20px;font-weight:800;letter-spacing:-.03em;padding-left:0;font-variant-numeric:tabular-nums}
.ms td.y.hot{color:var(--red)}
.ev{display:block;border-radius:6px;padding:5px 8px;font-size:11.5px;line-height:1.3;font-weight:600}
.ev.ban{background:var(--red-tint);color:var(--red-ink)}
.ev.ban.full{background:var(--red);color:#fff}
.ev.q{background:var(--parchment);color:var(--ink-80);font-weight:500}

/* ── snapshots ── */
.snaps{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;flex:1;min-height:0}
.snap{border:1px solid var(--hair);border-radius:16px;padding:14px 14px 12px;display:grid;gap:10px;align-content:start}
.snap-h{display:flex;justify-content:space-between;align-items:baseline}
.snap-h .d{font-size:22px;font-weight:800;letter-spacing:-.03em}
.snap-h .n{font-size:11px;color:var(--muted)}
.sg{width:100%;border-collapse:separate;border-spacing:3px;table-layout:fixed}
.sg th{font-size:9.5px;font-weight:700;color:var(--ink-80);line-height:1.25;padding-bottom:2px}
.sg th.grp{font-size:9px;font-weight:800;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;border-bottom:1.5px solid var(--ink);padding-bottom:3px}
.sg td{height:44px;border-radius:5px;text-align:center;font-size:13px;font-weight:800}
.sg td.rl{text-align:left;font-size:10.5px;font-weight:700;color:var(--ink);padding-left:0;line-height:1.2}
.sg td.ok{background:var(--blue-tint);color:var(--blue)}
.sg td.no{background:var(--ink);color:#fff}
.sg td.no.newly{background:var(--red);color:#fff}
.snap-f{font-size:12.5px;line-height:1.45;color:var(--ink-80)}
.snap-f b{font-weight:700;color:var(--ink)}

/* ── catalogue impact ── */
.im{width:100%;border-collapse:separate;border-spacing:4px;table-layout:fixed;font-variant-numeric:tabular-nums}
.im th{font-size:10.5px;font-weight:600;color:var(--ink-80);padding:0 0 4px;line-height:1.3}
.im th .cp{display:block;font-size:13px;font-weight:700;color:var(--ink)}
.im th.seg{font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;border-bottom:2px solid var(--ink)}
.im td{height:30px;border-radius:6px;text-align:right;padding:0 12px;font-size:14px;font-weight:700}
.im td.rf{text-align:left;padding-left:2px;font-size:14px;font-weight:800;border-radius:0}
.im td small{font-size:10px;font-weight:600;opacity:.8;margin-left:6px}
.im td.tot{background:transparent;color:var(--ink-80);font-weight:600;font-size:13px}
.im tr.sum td{border-top:2px solid var(--ink);border-radius:0;height:32px}
.impact-side{display:grid;grid-template-columns:1fr 290px;gap:22px;min-height:0}
.big{display:grid;gap:8px;align-content:start;border-left:1px solid var(--hair);padding-left:20px}
.big .num{font-size:52px;font-weight:800;letter-spacing:-.05em;color:var(--red);line-height:1}
.big .lbl{font-size:13px;line-height:1.5;color:var(--ink-80)}
.big .lbl b{color:var(--ink)}
.big hr{border:0;border-top:1px solid var(--hair-soft);margin:6px 0}

/* ── passport ── */
.pp{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed;font-variant-numeric:tabular-nums}
.pp th{font-size:10.5px;font-weight:700;color:var(--ink-80);text-align:left;padding:0 8px 7px;vertical-align:bottom;line-height:1.3;border-bottom:2px solid var(--ink)}
.pp td{font-size:12px;padding:0 8px;height:33px;border-bottom:1px solid var(--hair-soft);vertical-align:middle;color:var(--ink-80)}
.pp td.rf{font-size:15px;font-weight:800;color:var(--ink);padding-left:0}
.pp td.num{text-align:right}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:3px 8px;white-space:nowrap}
.t-a1{background:var(--parchment);color:var(--ink-80)} .t-a2l{background:#fff4dc;color:#8a5a00} .t-a3{background:#ffe3cc;color:#9a3d00}
.t-yes{background:var(--red-tint);color:var(--red-ink)} .t-no{background:var(--blue-tint);color:var(--blue)}
.t-red{background:var(--red);color:#fff} .t-ink{background:var(--ink);color:#fff} .t-soft{background:var(--red-tint);color:var(--red-ink)} .t-open{background:var(--parchment);color:#8a94a3;font-weight:500}

/* ── national cards ── */
.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;align-content:start}
.card{border:1px solid var(--hair);border-radius:16px;padding:15px 15px 13px;display:grid;gap:9px;align-content:start}
.card-h{display:flex;align-items:center;gap:10px}
.card-h img{width:30px}
.card-h .cn{font-size:16px;font-weight:800;letter-spacing:-.02em}
.pill{display:inline-flex;align-self:start;justify-self:start;font-size:10.5px;font-weight:700;padding:4px 9px;border-radius:999px}
.pill.eu{background:var(--blue-tint);color:var(--blue)}
.pill.own{background:var(--ink);color:#fff}
.kv{display:grid;gap:3px}
.kv .k{font-size:9.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.kv .v{font-size:11.5px;line-height:1.45;color:var(--ink)}
.kv .v b{font-weight:700;color:var(--red-ink)}
.callout{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;border-left:4px solid var(--red);background:var(--red-tint);border-radius:0 12px 12px 0;padding:12px 18px}
.callout .big2{font-size:30px;font-weight:800;letter-spacing:-.04em;color:var(--red)}
.callout .t{font-size:13px;line-height:1.5;color:var(--ink-80)}
.callout .t b{color:var(--ink);font-weight:700}
.callout.blue{border-left-color:var(--blue);background:#eef5fc}

/* ── v3: O/X tables (year × refrigerant, residential | commercial) ── */
.oxwrap{display:grid;grid-template-columns:1fr 1fr;gap:26px;min-height:0}
.oxh{display:flex;align-items:baseline;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:4px;margin-bottom:4px}
.oxh b{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.oxh span{font-size:10.5px;color:var(--muted)}
.ox{width:100%;border-collapse:separate;border-spacing:2px 2px;table-layout:fixed;font-variant-numeric:tabular-nums}
.ox th{font-size:10px;font-weight:700;color:var(--ink-80);padding:0 0 2px}
.ox th.yr27{color:var(--red)}
.ox td{height:22px;text-align:center;border-radius:4px;font-size:13px;font-weight:800;line-height:1}
.ox td.nmc{text-align:left;padding:0 2px;border-radius:0;border-bottom:2px solid #cfd6df}
.ox td.nmc .nm{font-size:12.5px;font-weight:800;color:var(--ink)}
.ox td.nmc .gv{float:right;font-size:10.5px;font-weight:600;color:#7d8ca2;margin-top:2px}
.ox tr.gl td{height:14px;text-align:left;font-size:8.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#9aa5b4;padding:4px 0 0;border:0}
.ox td.O{background:var(--blue-tint);color:var(--blue)}
.ox td.P{background:#fff1dc;color:#9a5b00}
.ox td.X{background:var(--ink);color:#fff;font-weight:700}
.ox td.X.first{background:var(--red)}
.oxnote{font-size:10.5px;line-height:1.45;color:var(--ink-80);margin-top:8px}
.oxnote b{color:var(--ink)}
.sym{display:inline-flex;align-items:center;justify-content:center;width:20px;height:16px;border-radius:4px;font-size:11px;font-weight:800;margin-right:4px}

/* ── v3: milestones — one box height, centred, stronger row rules ── */
.ms td{border-bottom:1.5px solid #cfd6df;height:50px;padding:4px 4px}
.ms td.y{border-bottom:1.5px solid #cfd6df}
.ev{display:flex;align-items:center;justify-content:center;text-align:center;height:40px;padding:0 10px;font-size:11.5px;line-height:1.25}

/* ── v3: snapshots with build icons ── */
.snaps{gap:16px;flex:0 0 auto}
.snap{padding:12px 14px 10px;gap:6px}
.sg{border-spacing:4px 4px}
.sg td{height:30px}
.sg th.ic{padding:4px 0 2px;border-radius:5px}
.sg th.ic.m{background:#eceff3}
.sg th.ic.s{background:#fff;box-shadow:inset 0 0 0 1.5px #cfd6df}
.sg th.ic svg{display:block;margin:0 auto 2px}
.sg th.ic span{display:block;font-size:9.5px;font-weight:700;color:var(--ink)}
.snap-f{font-size:11.5px}
.lower{display:grid;grid-template-columns:1.35fr 1fr;gap:18px;min-height:0}
.ct{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed}
.ct th{font-size:9.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:left;padding:0 6px 4px;border-bottom:2px solid var(--ink)}
.ct td{font-size:11px;padding:3px 6px;border-bottom:1px solid var(--hair-soft);color:var(--ink-80);vertical-align:middle;line-height:1.3}
.ct td.k{font-weight:800;color:var(--ink);white-space:nowrap}
.ct td .tag{font-size:10px;padding:2px 7px}
.legend-box{display:grid;gap:7px;align-content:start;font-size:11px;line-height:1.4;color:var(--ink-80)}
.legend-box .lr{display:grid;grid-template-columns:44px 1fr;gap:8px;align-items:center}
.legend-box .lr .ib{height:30px;border-radius:5px;display:flex;align-items:center;justify-content:center}
.legend-box .lr .ib.m{background:#eceff3}
.legend-box .lr .ib.s{background:#fff;box-shadow:inset 0 0 0 1.5px #cfd6df}
.legend-box b{color:var(--ink)}
.callout.slim{padding:9px 16px;gap:12px}
.callout.slim .big2{font-size:24px}
.callout.slim .t{font-size:11.5px}

/* ── v3: passport legend ── */
.pp td{height:31px}
.pp th.grp{border-bottom:0;padding-bottom:2px;font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--red-ink);text-align:center}
.pp th.grp span{display:block;border-bottom:2px solid var(--red);padding-bottom:3px}
.ppleg{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;font-size:11px;color:var(--ink-80)}
.ppleg b{color:var(--ink)}
.ppnotes{display:grid;grid-template-columns:repeat(3,1fr);gap:6px 18px;font-size:10.5px;line-height:1.45;color:var(--ink-80);border-top:1px solid var(--hair);padding-top:8px}
.ppnotes b{color:var(--ink)}

/* ── v3: national pills ── */
.pills{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;flex:1;min-height:0}
.pillc{border:1.5px solid var(--hair);border-radius:999px;overflow:hidden;display:grid;grid-template-rows:96px minmax(0,1fr) minmax(0,1fr) minmax(0,1.3fr);min-height:0;background:#fff}
.pillc .top{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;padding:0 14px 9px;text-align:center;background:var(--parchment)}
.pillc .top img{width:34px}
.pillc .top .cn{font-size:15px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.pillc .top .pill{justify-self:auto;align-self:auto}
.pillc .sec{padding:6px 16px;text-align:center;display:flex;flex-direction:column;justify-content:center;gap:4px;border-top:1px solid var(--hair)}
.pillc .sec .k{font-size:9px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.pillc .sec .v{font-size:11px;line-height:1.4;color:var(--ink)}
.pillc .sub{background:var(--blue);color:#fff;padding:10px 22px 0;text-align:center;display:flex;flex-direction:column;justify-content:flex-start;gap:4px}
.pillc .sub .k{font-size:9.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#cfe3fa}
.pillc .sub .h{font-size:13.5px;font-weight:800;line-height:1.22;letter-spacing:-.01em}
.pillc .sub .d{font-size:9.5px;line-height:1.3;color:#dbe9fb;font-weight:600}
.pillc.neg .sub{background:var(--red)}
.pillc.neg .sub .k,.pillc.neg .sub .d{color:#ffe1da}


/* ── v4: cover ── */
.page.cover{background:radial-gradient(circle at 78% 28%,#1b4f86 0,#0d2a52 34%,#071731 72%);color:#fff;padding:0;display:block}
.page.cover::before{width:auto;height:6px;right:0;bottom:auto;background:linear-gradient(90deg,var(--red) 0 50%,var(--blue) 50% 100%)}
.cv{position:absolute;inset:6px 0 0 0;padding:56px 64px 40px;display:grid;grid-template-columns:1fr 330px;gap:40px;align-items:center}
.cv-badge{display:inline-flex;background:#1d1d1f;border-radius:10px;padding:9px 14px;margin-bottom:22px}
.cv-badge img{height:22px;display:block}
.cv-kicker{font-size:13px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#7fb8f2}
.cv-title{font-size:60px;line-height:1.0;font-weight:800;letter-spacing:-.045em;margin:12px 0 0;text-wrap:balance;max-width:760px}
.cv-title em{font-style:normal;color:#ff8a73}
.cv-sub{font-size:18px;line-height:1.5;color:#d6e2f1;margin:18px 0 0;max-width:700px}
.cv-meta{margin-top:16px;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#a9b7cb}
.cv-flags{display:flex;gap:12px;margin-top:22px}
.cv-flags img{width:42px;display:block}
.cv-reg{margin-top:24px;display:inline-flex;align-items:center;gap:10px;border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:7px 14px;font-size:12.5px;font-weight:700;color:#e6eef8}
.cv-reg i{width:8px;height:8px;border-radius:50%;background:var(--red)}
.cv-stats{display:grid;gap:12px}
.cv-stat{border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);border-radius:16px;padding:16px 18px}
.cv-stat .n{font-size:34px;font-weight:800;letter-spacing:-.04em;line-height:1}
.cv-stat .n.red{color:#ff8a73}.cv-stat .n.blue{color:#7fb8f2}
.cv-stat .t{font-size:12.5px;line-height:1.45;color:#c9d6e6;margin-top:6px}
.cv-toc{position:absolute;left:64px;right:64px;bottom:26px;display:flex;gap:14px;align-items:baseline;border-top:1px solid rgba(255,255,255,.14);padding-top:12px;font-size:11.5px;color:#a9b7cb}
.cv-toc b{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#fff;font-weight:800;flex:none}
/* language switch */
.langsw{display:flex;gap:4px;margin-left:auto;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:3px}
.langsw button{font:inherit;font-size:11.5px;font-weight:700;color:#cfdaea;background:transparent;border:0;border-radius:999px;padding:5px 11px;cursor:pointer}
.langsw button[aria-pressed="true"]{background:#fff;color:var(--ink)}
.langsw button:focus-visible{outline:2px solid #7fb8f2;outline-offset:1px}
.topbar .draft{margin-left:10px}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}


html,body{margin:0;height:100%;overflow:hidden;background:#071731}
body{background:radial-gradient(circle at 15% 20%,#163c6a 0,#071731 42%,#030b19 100%);color:#fff;font-family:var(--font)}
.rp{height:100%;display:grid;grid-template-rows:58px 1fr 58px}
.rp-top{display:flex;align-items:center;gap:14px;padding:8px 18px;background:rgba(3,11,25,.72);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,.1);z-index:20}
.rp-top img{height:24px;display:block}
.rp-ed{font-size:12px;font-weight:700;color:#a9b7cb;border-left:1px solid rgba(255,255,255,.16);padding-left:14px}
.rp-sp{flex:1}
.rp-c{border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:#fff;border-radius:10px;padding:8px 12px;cursor:pointer;font:inherit;font-size:13px}
.rp-c:hover{background:rgba(255,255,255,.14)}.rp-c:disabled{opacity:.35;cursor:default}
.rp-c:focus-visible{outline:2px solid #7fb8f2;outline-offset:2px}
select.rp-c option{color:#111}
.rp-stage{position:relative;display:grid;place-items:center;padding:16px 56px 8px;min-height:0}
.rp-book{position:relative;aspect-ratio:16/9;width:min(94vw,calc((100vh - 140px) * 16 / 9),1450px);border-radius:18px;box-shadow:0 28px 75px rgba(4,17,38,.4)}
.rp-pg{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .35s ease;overflow:hidden;border-radius:18px}
.rp-pg.on{opacity:1;pointer-events:auto}
.rp-pg>.page{transform-origin:0 0;position:absolute;left:0;top:0}
.rp-nav{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#fff;font-size:20px;cursor:pointer;display:grid;place-items:center}
.rp-nav.l{left:10px}.rp-nav.r{right:10px}.rp-nav:disabled{opacity:.2;cursor:default}
.rp-foot{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 18px;border-top:1px solid rgba(255,255,255,.08)}
.rp-fn{grid-column:2;display:flex;align-items:center;gap:14px}
.rp-prog{width:min(360px,40vw);height:4px;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden}
.rp-prog i{display:block;height:100%;background:linear-gradient(90deg,#e0452c,#0066cc)}
.rp-pc{grid-column:3;justify-self:end;font-size:12px;color:#a9b7cb}
@media (max-width:700px){.rp-ed,#rpFs,.rp-pc{display:none}.rp-top{gap:8px;padding:8px 10px}.rp-top img{height:18px}.rp-c{font-size:12px;padding:6px 9px;white-space:nowrap}#rpPrint{min-width:0;max-width:38vw;overflow:hidden;text-overflow:ellipsis}#rpLang{flex:none}.rp-stage{padding:8px 8px 4px}.rp-nav{display:none}.rp-foot{grid-template-columns:1fr;padding:0 10px}.rp-fn{grid-column:1;justify-content:center}.rp-prog{width:30vw}}
@media (prefers-reduced-motion:reduce){.rp-pg{transition:none}}
@page{size:1280px 720px;margin:0}
@media print{
  html,body{height:auto;overflow:visible;background:#fff}
  .rp{display:block}.rp-top,.rp-foot,.rp-nav{display:none!important}
  .rp-stage{display:block;padding:0}.rp-book{width:1280px;aspect-ratio:auto;box-shadow:none;border-radius:0}
  .rp-pg{position:relative;opacity:1;width:1280px;height:720px;break-after:page;border-radius:0}
  .rp-pg>.page{transform:none!important;border-radius:0}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}</style>

  <div class="ppnotes"><span><b>PRG (GWP)</b> — potentiel de réchauffement planétaire : effet de réchauffement de 1 kg du gaz sur 100 ans, par rapport à 1 kg de CO₂. Les seuils UE sont à 150 et 750.</span><span><b>Classe de sécurité</b> (ISO 817) : A1 ininflammable · A2L faiblement inflammable · A3 inflammable — d'où la dérogation de sécurité.</span><span><b>PFAS</b> — substances per- et polyfluoroalkylées, les « polluants éternels ». Une restriction UE est toujours à l'examen de l'ECHA ; rien d'adopté (oct. 2026). Le R32 lui-même n'est pas un PFAS.</span></div></div>
