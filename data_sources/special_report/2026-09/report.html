 p_PL_h:"Fix one sentence",p_PL:"The 8% / 23% VAT split turns on whether the unit sits inside the building envelope. An air/water heat pump's outdoor unit is outside by definition. Taxing the technology's normal configuration at three times the rate of the exception is a drafting artefact, not a policy choice. Removing it makes Poland decisively Europe's cheapest market for this installation.",

 prop_kicker1:"Proposals · 1 of 2", prop_kicker2:"Proposals · 2 of 2", prop_dek2:"The remaining two markets — and one proposal of our own, as a participant in this market.",
 p_why:"Why this proposal", p_DE_w:"Germany's gap is not in the hardware: its heat pump price is third of five (p. 4), yet installation reaches <b>€21,000</b> (p. 5) and even maximum funding leaves <b>€14,453</b> with the household (p. 9). More money does not close that. The two items this report can quantify are the <b>form</b> of the subsidy and the <b>19% VAT</b> — €5,437 on this job.", p_GB_w:"Britain is already the cheapest of the five at <b>€11,829</b>, and the fixed grant leaves only <b>€3,084</b> (p. 9). The cost side is solved, so the proposal has to address what is not: July's record <b>8,150 applications against ~2,500 redemptions</b>, and the 0% VAT reverting to 5% in March 2027.", p_FR_w:"France has the <b>lowest heat pump price</b> of the five (€6,352, p. 4) and the second-lowest VAT — but the <b>second-highest installation cost</b> (€9,500, p. 5). Neither price nor tax is the lever left; installation is, and that is exactly what the September tightening acts on.", p_PL_w:"Poland is the one market where a single sentence moves the total. It has the <b>highest heat pump price</b> of the five (€8,630) and still the second-lowest bill (€15,260), because the work is taxed at 8%. Applied as written, <b>23%</b> would make it €17,380 (p. 9).", p_IT_w:"Italy is the only market here with no published installed-cost series: its installation range (<b>€2,435–11,526</b>, p. 5) is more than twice as wide as Britain's, because it had to be derived from commercial portals that disagree by a factor of two. The widest bar in this report is an evidence problem, not a cost finding.", p_us_w:"Page 10 is the reason: in Germany's own register, Asian manufacturers supply <b>426 models against 203</b> European premium ones, and the heat pump followed through this report is registered and eligible at the same net price everywhere. Availability is not the constraint. Visibility at the point of decision is.",
 mk_kicker:"Open the database", mk_title:"Every listed heat pump in Europe. One database.", mk_dek:"The catalogue behind every figure in this report. Five markets, one technical baseline — searchable in seconds, comparable side by side, printable as a quote-ready data sheet. Choose your market: scan the code or click the card.", mk_open:"Open", mk_models:"models", mk_free:"Free for 15 days — no payment details.", mk_scan:"Scan the code with a phone camera, or click any card.", tag_DE:"The BAFA-list database for installers and planners.", tag_GB:"The Ofgem PEL companion for MCS installers.", tag_FR:"The air/water heat-pump reference base for RGE professionals.", tag_PL:"The heat-pump database with confirmed ZUM status.", tag_IT:"The database with GSE catalogue status (Conto Termico).",

 read_kicker:"Lesehinweis",read_title:"Wir vergleichen keine Märkte. Wir verfolgen eine Wärmepumpe.",read_dek:"Drei Regeln, auf jeder folgenden Seite angewandt.",
 r1h:"Ein Produkt, keine Klasse",r1p:"Jeder Preis auf den folgenden Seiten gilt für eine Wärmepumpe: Daikin Altherma 3 R F, 8 kW, 230-l-Speicher — die meistverkaufte Luft/Wasser-Wärmepumpe Europas, weder Billigimport noch Premiumlinie, in allen fünf nationalen Registern eingetragen. Kein „8–10-kW-Band“.",
 r2h:"Jeder Euro hat einen Namen",r2p:"HeatPump DB veröffentlicht keine Preise. Wärmepumpenpreise stammen von je zwei Händlern pro Markt, der Steuerstatus ist auf der Händlerseite ausgewiesen. Die Installation stammt aus der Referenzanalyse (Miara, heatpumpswatch.org, Feb. 2026). Alles, was wir selbst rechnen, ist als solches gekennzeichnet.",
 r3h:"Spannen werden gezeigt, Mittelwerte verwendet",r3p:"Jede Kostenposition auf den folgenden Seiten ist eine Spanne, und die Grafiken zeigen die Spanne. Für eine vergleichbare Zahl je Land nehmen wir den arithmetischen Mittelwert dieser Spanne — nie den niedrigsten oder einen Schlagzeilenwert — und sagen das in der Grafik.",
 prod_kicker:"Die Referenz-Wärmepumpe",prod_title:"Die Wärmepumpe ist dieselbe",prod_dek:"Daikin Altherma 3 R F, 8 kW, 230-l-Integralspeicher — derselbe Eintrag in fünf nationalen Registern, eine Spezifikation.",prod_rated:"Nennleistung A2/W35",prod_scop:"SCOP",prod_ref:"Kältemittel",prod_noise:"Schallleistung außen",prod_reg:"Registriert · gelistet · förderfähig",prod_note:"Nichts auf dieser Seite unterscheidet sich nach Land. Was sich ab hier unterscheidet, ist nicht die Wärmepumpe.",
 hp_kicker:"Wärmepumpenpreis",hp_title:"Die Wärmepumpe kostet überall gleich viel",hp_dek:"Was die identische Wärmepumpe im Einkauf kostet, netto. Jeder Balken sind die zwei veröffentlichten Händlerpreise, die wir in diesem Markt gefunden haben; die Markierung ist der Mittelwert, den wir für den Vergleich verwenden.",

 hp_callout:"2.278 € trennen den günstigsten vom teuersten Markt, und Deutschland liegt in der Mitte. Auf die Wärmepumpe selbst gibt es keinen deutschen Aufschlag.",
 in_kicker:"Installation",in_title:"Die Installation nicht",in_dek:"Was der Einbau derselben Wärmepumpe kostet, vor Steuern. Jeder Balken ist die Spanne der Gesamtkosten des Marktes aus der Referenzanalyse abzüglich des Wärmepumpenpreises dieses Marktes; die Markierung ist der verwendete Mittelwert. Kein Balken ist ein Angebot für einen konkreten Auftrag.",
 in_chart:"Installationskosten je Markt, netto — Balken = Spanne aus der Referenzanalyse · Markierung = verwendeter Mittelwert",

 in_why_h:"Teurere Stunden — oder mehr davon?",in_why_p:"Beides, und vor allem etwas Drittes: Zum deutschen Stundensatz kosten 110 Monteurstunden 6.600–7.700 € — rund ein Drittel der 21.000 €. Dieselben Stunden zum polnischen Satz kosteten immer noch 2.200–3.300 €; der Stundensatz erklärt also nur einen kleineren Teil der Lücke. Der Rest ist der Leistungsumfang, den Deutschland als Standard verlangt: gegossenes Fundament, Drehstromanschluss mit §14a-Steuerbox, Wasseraufbereitung, hydraulischer Abgleich und Förderdokumentation (nächste Seite).",
 in_rate_chart:"Stundensatz Installateur, Endkunde (€/h)",in_hours_note:"Stundenzahlen sind nur für Deutschland veröffentlicht: 110 h für eine Wärmepumpe gegenüber 36 h für einen Gaskessel (ZVSHK-Panel, n = 1.121). Für die Vergleichsmärkte dokumentiert die Referenzanalyse kürzere Einbauzeiten ohne Zahl — deshalb vergleichen wir hier die Stundensätze, die dokumentiert sind.",
 tot_kicker:"Die Rechnung",tot_title:"Was der Haushalt zahlt",tot_dek:"Wärmepumpe plus Installation, dann Mehrwertsteuer auf die installierte Lieferung. Das ist die Zahl im Angebot — vor jeder Förderung.",tot_chart:"Was der Haushalt zahlt, EUR — Wärmepumpe · Installation · MwSt",leg_hp:"Wärmepumpe",leg_in:"Installation",leg_vat:"MwSt",

 br_kicker:"Die Differenz, aufgeschlüsselt",br_title:"Was die zusätzlichen 22.224 € kaufen",br_dek:"Ein britischer Haushalt zahlt für diese Installation 11.829 €, ein deutscher 34.053 €. Der Balken unten sind die 22.224 € dazwischen, aufgeteilt in die einzigen drei Dinge, die sich unterscheiden können.",

 vat_callout:"Ein Festzuschuss lässt dem britischen Haushalt 3.084 €. Deutschlands 50 % lassen 20.053 € — und selbst die maximalen 70 % lassen 14.453 €, mehr als das Vierfache des britischen Werts. Ein Prozentsatz der Rechnung belohnt eine höhere Rechnung; ein Festbetrag nicht.",
 vat_note:"HeatPump-DB-Berechnung aus den veröffentlichten Förderregeln; keine Förderfähigkeit wird behauptet. Polen fehlt, weil sich seine Staffelung nicht auf eine belastbare Zahl reduzieren lässt.",
 av_kicker:"Unser eigener Befund",av_title:"Die günstigere Wärmepumpe steht auch auf der deutschen Liste",av_dek:"Das deutsche Preisniveau wird oft mit marktbeherrschenden Premiummarken erklärt. Das eigene Register sagt etwas anderes: Von den in Deutschland förderfähig registrierten 8–10-kW-Luft/Wasser-Wärmepumpen stellen asiatische Hersteller doppelt so viele Modelle wie europäische Premiummarken.",

 av_k1:"Im deutschen Register",av_k1v:"426 vs. 203",av_k1s:"Modelle asiatischer Marken gegenüber europäischen Premiummodellen, von 1.360 in dieser Klasse registrierten",

 av_k3:"Was diese Grafik nicht ist",av_k3v:"Marktanteil",av_k3s:"Das sind Anteile registrierter Modelle, nicht verkaufter Geräte. Verfügbarkeit ist kein Marktanteil.",
 av_callout:"Die günstigere Wärmepumpe fehlt in Deutschland nicht. Sie ist registriert, gelistet und förderfähig. Deutschlands Premium-Neigung ist eine Tatsache über das, was eingebaut wird — nicht über das, was gekauft werden kann.",
 av_reg:"Registriert = im nationalen Katalog dieser Leistungsklasse und für das Förderprogramm des Marktes zugelassen (HeatPump-DB-Katalog, 01.09.2026).",
 prop_kicker:"Vorschläge",prop_title:"Was sich ändern sollte",prop_dek:"Ein Vorschlag je Markt — und der Befund aus diesem Report, der dazu geführt hat.",
 p_DE_h:"Die Form der Förderung ändern, nicht die Höhe",p_DE:"Ein Prozentsatz der Rechnung macht ein höheres Angebot für jeden in der Kette lohnender; ein Festbetrag pro kW nimmt diesen Anreiz, ohne einen Euro mehr zu kosten. Deutschland ist zudem als einziges der fünf beim vollen Steuersatz — der ermäßigte Satz jedes Nachbarn ist der größte einzeln bezifferte Posten. Und das §14a-/400-V-Paket, im Prinzip richtig, wird auf jeder Baustelle neu erfunden; ein Standardpaket für Wohnhäuser spart Stunden.",
 p_GB_h:"Die Kostenseite ist gelöst; die Grenze hat sich verschoben",p_GB:"Im Juli erreichten die BUS-Anträge mit 8.150 einen Rekord, eingelöst wurden wie jeden Monat dieses Jahres rund 2.500. Mehr Zuschuss bewegt das nicht; Installationskapazität schon. Und die 0 % MwSt kehren am 31.03.2027 auf 5 % zurück — eine geplante Erhöhung um ~600 € auf einen 12.000-€-Auftrag, genau dann, wenn das Volumen Richtung 600.000 im Jahr beschleunigen muss.",
 p_FR_h:"Qualität ohne Kapazität heißt weniger Installationen",p_FR:"Die Verschärfung vom 1. September — europäische Zulassung Pflicht, beibehaltenes Gas aus Komplettsanierungen ausgeschlossen — weist in die richtige Richtung. Mit Zertifizierungskapazität hebt sie das Niveau; allein senkt sie die Zahl. Frankreich verbindet bereits die zweitniedrigste MwSt mit einem Festzuschuss. Die Struktur stimmt.",
 p_PL_h:"Einen Satz korrigieren",p_PL:"Die Aufteilung 8 % / 23 % hängt davon ab, ob das Gerät innerhalb der Gebäudehülle steht. Das Außengerät einer Luft/Wasser-Wärmepumpe steht per Definition außerhalb. Die Normalkonfiguration der Technik mit dem dreifachen Satz der Ausnahme zu besteuern, ist ein Redaktionsartefakt, keine politische Entscheidung. Ohne ihn ist Polen klar der günstigste Markt Europas für diese Installation.",
 p_IT_h:"Das Problem sind die Belege, nicht die Kosten",p_IT:"Europas zweitgrößter Markt hat keine belastbare veröffentlichte Kostenreihe; sein Preisniveau lässt sich nur aus Portalen schätzen, die um den Faktor zwei auseinanderliegen. Eine Kostenreihe von Assoclima oder GSE — wie Verbraucherzentrale, MCS und ADEME sie veröffentlichen — ließe italienische Politik an einer Basis statt an einem Eindruck messen.",
 p_us_h:"HeatPump DB",p_us:"<b>Das Register sichtbar machen.</b> Dieselbe Wärmepumpe zum gleichen Nettopreis ist in jedem dieser Märkte registriert. Die Grenze ist nicht die Verfügbarkeit, sondern die Sichtbarkeit im Moment der Entscheidung und der Anreiz, der das Angebot lenkt. Den registrierten Katalog vor dem Angebot vor den Haushalt zu stellen, ist die günstigste verfügbare Maßnahme und braucht kein Gesetz.",p_us_d:"Offenlegung: Das ist auch, was HeatPump DB tut. Wägen Sie den Vorschlag in diesem Wissen ab.",

 p_why:"Warum dieser Vorschlag", p_DE_w:"Deutschlands Lücke liegt nicht an der Hardware: Der Wärmepumpenpreis ist der dritte von fünf (S. 4), die Installation erreicht aber <b>21.000 €</b> (S. 5), und selbst die Maximalförderung lässt dem Haushalt <b>14.453 €</b> (S. 9). Mehr Geld schließt das nicht. Quantifizieren lassen sich in diesem Report zwei Posten: die <b>Form</b> der Förderung und die <b>19 % MwSt</b> — 5.437 € bei diesem Auftrag.", p_GB_w:"Großbritannien ist mit <b>11.829 €</b> ohnehin der günstigste der fünf Märkte, und der Festzuschuss lässt nur <b>3.084 €</b> übrig (S. 9). Die Kostenseite ist gelöst, also muss der Vorschlag das adressieren, was es nicht ist: im Juli <b>8.150 Anträge gegenüber rund 2.500 eingelösten Gutscheinen</b> — und die Rückkehr der 0 % MwSt auf 5 % im März 2027.", p_FR_w:"Frankreich hat den <b>niedrigsten Wärmepumpenpreis</b> der fünf (6.352 €, S. 4) und die zweitniedrigste MwSt — aber die <b>zweithöchsten Installationskosten</b> (9.500 €, S. 5). Weder Preis noch Steuer sind der verbleibende Hebel, sondern die Installation. Genau dort setzt die Verschärfung vom September an.", p_PL_w:"Polen ist der eine Markt, in dem ein einziger Satz die Endsumme bewegt. Es hat den <b>höchsten Wärmepumpenpreis</b> der fünf (8.630 €) und trotzdem die zweitniedrigste Rechnung (15.260 €), weil die Arbeit mit 8 % besteuert wird. Wortgetreu angewandt ergäben <b>23 %</b> 17.380 € (S. 9).", p_IT_w:"Italien ist der einzige Markt hier ohne veröffentlichte Kostenreihe: Seine Installationsspanne (<b>2.435–11.526 €</b>, S. 5) ist mehr als doppelt so breit wie die britische, weil sie aus Portalen abgeleitet werden musste, die um den Faktor zwei auseinanderliegen. Der breiteste Balken dieses Reports ist ein Beleg-, kein Kostenbefund.", p_us_w:"Seite 10 ist der Grund: Im deutschen Register stellen asiatische Hersteller <b>426 Modelle gegenüber 203</b> europäischen Premiummodellen, und die in diesem Report verfolgte Wärmepumpe ist überall registriert und förderfähig — zum gleichen Nettopreis. Die Grenze ist nicht die Verfügbarkeit, sondern die Sichtbarkeit im Moment der Entscheidung.",
 mk_kicker:"Die Datenbank öffnen", mk_title:"Jede gelistete Wärmepumpe Europas. Eine Datenbank.", mk_dek:"Der Katalog hinter jeder Zahl dieses Reports. Fünf Märkte, eine technische Basis — in Sekunden durchsuchbar, direkt vergleichbar, als angebotsfertiges Datenblatt druckbar. Markt wählen: Code scannen oder Karte anklicken.", mk_open:"Öffnen", mk_models:"Modelle", mk_free:"15 Tage kostenlos — ohne Zahlungsdaten.", mk_scan:"Code mit der Handykamera scannen oder eine Karte anklicken.", tag_DE:"Die Datenbank zur BAFA-Liste — für Fachhandwerk und Planer.", tag_GB:"Der Ofgem-PEL-Begleiter für MCS-Installateure.", tag_FR:"Die Luft/Wasser-Referenzdatenbank für RGE-Profis.", tag_PL:"Die Wärmepumpen-Datenbank mit bestätigtem ZUM-Status.", tag_IT:"Die Datenbank mit GSE-Katalogstatus (Conto Termico).",

 r1h:"Un produit, pas une classe",r1p:"Chaque prix des pages suivantes concerne une seule pompe à chaleur : Daikin Altherma 3 R F, 8 kW, ballon 230 l — la PAC air/eau la plus vendue d’Europe, ni import à bas coût ni gamme premium, inscrite dans les cinq registres nationaux. Pas une « tranche 8–10 kW ».",
 r2h:"Chaque euro a un nom",r2p:"HeatPump DB ne publie aucun prix. Les prix des pompes à chaleur sont relevés chez deux fournisseurs par marché, statut TVA indiqué sur la page du fournisseur. L’installation provient de l’analyse de référence (Miara, heatpumpswatch.org, fév. 2026). Tout ce que nous calculons nous-mêmes est signalé comme tel.",
 r3h:"Les fourchettes sont montrées, les points médians sont utilisés",r3p:"Chaque coût des pages suivantes est une fourchette, et les graphiques montrent la fourchette. Pour un chiffre comparable par pays, nous prenons le point médian arithmétique de cette fourchette — jamais le plus bas ni un chiffre d’appel — et nous le disons sur le graphique.",

 in_k1:"Grande-Bretagne → Allemagne",in_k1s:"4 250 € → 21 000 €, points médians comparés",in_k2:"La seule installation allemande",in_k2s:"plus que le système complet installé — pompe à chaleur et main-d’œuvre — dans chacun des autres marchés",in_k3:"Part de la main-d’œuvre en Allemagne",in_k3v:"environ un tiers",in_k3s:"110 heures de technicien × 60–70 € = 6 600–7 700 € sur 21 000 €",
 in_why_h:"Des heures plus chères, ou plus d’heures ?",in_why_p:"Les deux, et surtout autre chose : au taux allemand, 110 heures de technicien font 6 600–7 700 € — environ un tiers des 21 000 €. Les mêmes heures au taux polonais coûteraient encore 2 200–3 300 € ; le taux horaire n’explique donc qu’une minorité de l’écart. Le reste, c’est le périmètre de travaux que l’Allemagne exige en standard : dalle coulée, raccordement triphasé avec boîtier de pilotage réseau, traitement de l’eau, équilibrage hydraulique et dossier d’aide (page suivante).",
 in_rate_chart:"Taux horaire installateur, client final (€/h)",in_hours_note:"Les heures ne sont publiées que pour l’Allemagne : 110 h pour une pompe à chaleur contre 36 h pour une chaudière gaz (panel ZVSHK, n = 1 121). Pour les marchés de comparaison, l’analyse de référence documente des durées plus courtes, sans chiffre — la comparaison porte donc ici sur les taux, qui sont documentés.",

 av_kicker:"Notre propre constat",av_title:"La pompe à chaleur moins chère figure aussi sur la liste allemande",av_dek:"Le niveau de prix allemand est souvent expliqué par la domination des marques premium. Son propre registre dit autre chose : parmi les pompes à chaleur air/eau 8–10 kW inscrites en Allemagne pour l’aide, les fabricants asiatiques fournissent deux fois plus de modèles que les marques premium européennes.",
 av_chart:"Part des pompes à chaleur air/eau 8–10 kW inscrites dans chaque pays",av_prem:"Marques premium européennes (Viessmann, Vaillant, Bosch, Stiebel Eltron)",av_asia:"Fabricants asiatiques (Daikin, Panasonic, LG, Midea …)",

 av_k3:"Ce que ce graphique n’est pas",av_k3v:"part de marché",av_k3s:"Ce sont des parts de modèles inscrits, pas d’unités vendues. Disponibilité n’est pas part de marché.",
 av_callout:"La pompe à chaleur moins chère ne manque pas en Allemagne. Elle est inscrite, listée et éligible. Le tropisme premium allemand est un fait sur ce qui est posé, pas sur ce qui peut être acheté.",
 av_reg:"Inscrite = présente dans le catalogue national de cette classe de puissance et éligible au dispositif d’aide du marché (catalogue HeatPump DB, 01/09/2026).",
 prop_kicker:"Propositions",prop_title:"Ce qui devrait changer",prop_dek:"Une proposition par marché — et le constat de ce rapport qui y a conduit.",
 p_DE_h:"Changer la forme de l’aide, pas son montant",p_DE:"Un pourcentage de la facture rend un devis plus élevé plus rentable pour toute la chaîne ; un forfait par kW supprime cette incitation sans coûter un euro de plus. L’Allemagne est aussi la seule des cinq au taux plein de TVA — le taux réduit qu’appliquent tous ses voisins est le plus gros poste quantifié. Et le paquet §14a / 400 V, juste sur le principe, est réinventé à chaque chantier ; un paquet domestique standard économiserait des heures.",
 p_GB_h:"Le coût est réglé ; la contrainte s’est déplacée",p_GB:"En juillet, les demandes BUS ont atteint un record de 8 150, les bons utilisés restant vers 2 500 comme chaque mois cette année. Plus d’aide n’y change rien ; la capacité d’installation, oui. Et la TVA à 0 % revient à 5 % le 31 mars 2027 — une hausse programmée de ~600 € sur un chantier de 12 000 €, au moment précis où le volume doit accélérer vers 600 000 par an.",
 p_FR_h:"La qualité sans capacité, c’est moins d’installations",p_FR:"Le durcissement du 1er septembre — agrément européen obligatoire, gaz conservé exclu des rénovations d’ampleur — va dans le bon sens. Couplé à une capacité de certification, il élève le niveau ; seul, il réduit le nombre. La France combine déjà la deuxième TVA la plus basse et une aide fixe. La structure est saine.",
 p_PL_h:"Corriger une phrase",p_PL:"La répartition 8 % / 23 % dépend de la position de l’unité dans l’enveloppe du bâtiment. L’unité extérieure d’une PAC air/eau est dehors par définition. Taxer la configuration normale de la technologie au triple du taux de l’exception relève de la rédaction, pas d’un choix politique. Sans cela, la Pologne devient nettement le marché le moins cher d’Europe pour cette installation.",
 p_IT_h:"Le problème, c’est la preuve, pas le coût",p_IT:"Le deuxième marché européen n’a aucune série publiée fiable de coûts installés ; son niveau de prix ne s’estime qu’à partir de portails commerciaux qui divergent du simple au double. Une série de coûts Assoclima ou GSE — comme en publient Verbraucherzentrale, MCS et ADEME — permettrait de fonder la politique italienne sur une base plutôt que sur une impression.",
 p_us_h:"HeatPump DB",p_us:"<b>Rendre le registre visible.</b> La même pompe à chaleur, au même prix net, est inscrite dans chacun de ces marchés. La contrainte n’est pas la disponibilité, mais la visibilité au moment de la décision et l’incitation qui oriente le devis. Mettre le catalogue inscrit sous les yeux du ménage avant le devis est l’intervention la moins coûteuse et ne demande aucune loi.",p_us_d:"Transparence : c’est aussi ce que fait HeatPump DB. Jugez la proposition en le sachant.",
 meth_kicker:"Méthode",meth_title:"Méthode et sources",meth_dek:"Chaque chiffre de ce rapport remonte à une source nommée ou à un calcul que nous signalons.",meth_th1:"Marché",meth_th2:"Prix de la pompe à chaleur — deux fournisseurs, TVA relevée sur la page",meth_th3:"Base d’installation",meth_th4:"TVA",

 meth_in_ref:"Miara 2026 : fourchette du coût installé moins le point médian de la tranche équipement",meth_in_IT:"Portails italiens 10–20 k€ TTC (Enpal, Instapro, Homedeal, PrezziCosto), nets de 10 %, moins le prix de la pompe à chaleur de référence",
 meth_rules_h:"Règles",meth_r1:"Un produit, une spécification, cinq registres (catalogue HeatPump DB du 01/09/2026).",meth_r2:"Deux fournisseurs par marché ; TVA relevée sur la page du fournisseur ; offres dépassées écartées et consignées (kit UK série D 2024, 8 400 £).",meth_r3:"Les graphiques montrent toute la fourchette relevée ; le chiffre comparable par pays est son point médian arithmétique.",meth_r4:"Change : EUR/PLN 4,309 · GBP/EUR 1,166 (début sept. 2026).",meth_r5:"Contre-vérification : RWTH-EBC 2025-001 (DOI 10.18154/RWTH-2025-05335), même produit DE–UK : à 3 % près.",meth_r6:"Les montants d’aide sont des calculs HeatPump DB d’après les règles publiées — aucune éligibilité n’est affirmée.",
 meth_src_h:"Références principales",meth_s1:"Miara, M. (2026) : Heat Pump Installation Costs: Germany vs. Europe. heatpumpswatch.org, 10 fév. 2026.",meth_s2:"Vering, Kühn, Maier, Müller (2025) : Analyse der Endkundenpreise für Luft-Wasser-Wärmepumpen DE–UK. RWTH Aachen / Octopus Energy.",meth_s3:"Verbraucherzentrale RLP (2025) : 160 devis de PAC. Panel installateurs ZVSHK (n = 1 121). Documents ADEME, MCS, NFOŚiGW, GSE.",
 prop_kicker1:"Propositions · 1 sur 2", prop_kicker2:"Propositions · 2 sur 2", prop_dek2:"Les deux marchés restants — et une proposition de notre part, en tant qu’acteur de ce marché.",
 p_why:"Pourquoi cette proposition", p_DE_w:"L’écart allemand ne vient pas du matériel : son prix de pompe à chaleur est le 3e sur cinq (p. 4), mais l’installation atteint <b>21 000 €</b> (p. 5) et même l’aide maximale laisse <b>14 453 €</b> au ménage (p. 9). Plus d’argent ne referme pas cela. Deux postes sont chiffrables ici : la <b>forme</b> de l’aide et la <b>TVA à 19 %</b> — 5 437 € sur ce chantier.", p_GB_w:"La Grande-Bretagne est déjà la moins chère des cinq à <b>11 829 €</b>, et la prime fixe ne laisse que <b>3 084 €</b> (p. 9). Le coût est réglé : la proposition doit donc viser ce qui ne l’est pas — en juillet, <b>8 150 demandes contre ~2 500 bons utilisés</b>, et le retour de la TVA de 0 à 5 % en mars 2027.", p_FR_w:"La France a le <b>prix de pompe à chaleur le plus bas</b> des cinq (6 352 €, p. 4) et la deuxième TVA la plus basse — mais le <b>deuxième coût d’installation le plus élevé</b> (9 500 €, p. 5). Ni le prix ni la taxe ne sont le levier restant : c’est l’installation, et c’est précisément là qu’agit le durcissement de septembre.", p_PL_w:"La Pologne est le seul marché où une phrase déplace le total. Elle a le <b>prix de pompe à chaleur le plus élevé</b> des cinq (8 630 €) et pourtant la deuxième facture la plus basse (15 260 €), parce que les travaux sont taxés à 8 %. Appliqué à la lettre, <b>23 %</b> porterait le total à 17 380 € (p. 9).", p_IT_w:"L’Italie est le seul marché ici sans série publiée de coûts installés : sa fourchette d’installation (<b>2 435–11 526 €</b>, p. 5) est plus de deux fois plus large que la britannique, car il a fallu la dériver de portails commerciaux qui divergent du simple au double. La barre la plus large du rapport est un problème de preuve, pas de coût.", p_us_w:"La page 10 en est la raison : dans le registre allemand, les fabricants asiatiques fournissent <b>426 modèles contre 203</b> modèles premium européens, et la pompe à chaleur suivie ici est inscrite et éligible partout, au même prix net. La contrainte n’est pas la disponibilité, mais la visibilité au moment de la décision.",
 mk_kicker:"Ouvrir la base", mk_title:"Toutes les pompes à chaleur référencées d’Europe. Une seule base.", mk_dek:"Le catalogue derrière chaque chiffre de ce rapport. Cinq marchés, une base technique — consultable en quelques secondes, comparable côte à côte, imprimable en fiche prête pour le devis. Choisissez votre marché : scannez le code ou cliquez sur la carte.", mk_open:"Ouvrir", mk_models:"modèles", mk_free:"15 jours gratuits — sans coordonnées bancaires.", mk_scan:"Scannez le code avec l’appareil photo du téléphone, ou cliquez sur une carte.", tag_DE:"La base de la liste BAFA — pour artisans et bureaux d’études.", tag_GB:"Le compagnon Ofgem PEL des installateurs MCS.", tag_FR:"La base de référence des PAC air/eau pour les pros RGE.", tag_PL:"La base des pompes à chaleur avec statut ZUM confirmé.", tag_IT:"La base avec statut au catalogue GSE (Conto Termico).",

 prop_kicker:"Propozycje",prop_title:"Co powinno się zmienić",prop_dek:"Jedna propozycja na rynek — i ustalenie z tego raportu, które do niej doprowadziło.",
 p_DE_h:"Zmienić formę dotacji, nie jej wysokość",p_DE:"Procent od faktury sprawia, że wyższa wycena opłaca się każdemu w łańcuchu; stała kwota za kW usuwa tę zachętę bez dodatkowego kosztu. Niemcy jako jedyne z pięciu stosują też pełną stawkę VAT — obniżona stawka każdego sąsiada to największa pojedyncza policzona pozycja. A pakiet §14a / 400 V, słuszny co do zasady, jest projektowany od nowa na każdej budowie; standardowy pakiet domowy oszczędziłby godziny.",
 p_GB_h:"Strona kosztowa rozwiązana; ograniczenie się przesunęło",p_GB:"W lipcu wnioski BUS osiągnęły rekordowe 8 150, a zrealizowane bony trzymały się około 2 500 — jak co miesiąc w tym roku. Większa dotacja tego nie zmieni; przepustowość instalatorów — tak. A 0% VAT wraca do 5% 31 marca 2027 — zaplanowana podwyżka o ~600 € na zleceniu za 12 000 €, dokładnie wtedy, gdy wolumen musi przyspieszyć do 600 000 rocznie.",
 p_FR_h:"Jakość bez mocy przerobowych to mniej instalacji",p_FR:"Zaostrzenie z 1 września — wymagana europejska aprobata, zachowany gaz wykluczony z kompleksowych renowacji — wskazuje właściwy kierunek. W parze z przepustowością certyfikacji podnosi poziom; samo obniża liczbę. Francja już łączy drugi najniższy VAT ze stałą dotacją. Struktura jest zdrowa.",
 p_PL_h:"Poprawić jedno zdanie",p_PL:"Podział 8% / 23% zależy od tego, czy jednostka stoi w obrysie budynku. Jednostka zewnętrzna pompy powietrze/woda z definicji stoi na zewnątrz. Opodatkowanie normalnej konfiguracji technologii trzykrotnie wyższą stawką niż wyjątek to artefakt redakcyjny, nie wybór polityczny. Bez niego Polska staje się zdecydowanie najtańszym rynkiem Europy dla tej instalacji.",
 p_IT_h:"Problemem są dowody, nie koszt",p_IT:"Drugi rynek Europy nie ma wiarygodnej publikowanej serii kosztów instalacji; jego poziom cen da się oszacować tylko z portali komercyjnych, które różnią się dwukrotnie. Seria kosztów Assoclima lub GSE — jak publikują Verbraucherzentrale, MCS i ADEME — pozwoliłaby ustalać włoską politykę na podstawie bazy, a nie wrażenia.",
 p_us_h:"HeatPump DB",p_us:"<b>Pokazać rejestr.</b> Ta sama pompa ciepła w tej samej cenie netto jest zarejestrowana na każdym z tych rynków. Ograniczeniem nie jest dostępność, lecz widoczność w chwili decyzji i zachęta sterująca wyceną. Pokazanie zarejestrowanego katalogu gospodarstwu, zanim przyjdzie oferta, to najtańsza dostępna interwencja i nie wymaga ustawy.",p_us_d:"Ujawnienie: to także to, co robi HeatPump DB. Oceniaj propozycję, wiedząc o tym.",

 meth_rules_h:"Zasady",meth_r1:"Jeden produkt, jedna specyfikacja, pięć rejestrów (katalog HeatPump DB 01.09.2026).",meth_r2:"Dwóch dostawców na rynek; status VAT odczytany na stronie dostawcy; nieaktualne oferty odrzucone i odnotowane (zestaw UK serii D 2024, 8 400 £).",meth_r3:"Wykresy pokazują cały znaleziony przedział; jedna porównywalna liczba na kraj to jego środek arytmetyczny.",meth_r4:"Kursy: EUR/PLN 4,309 · GBP/EUR 1,166 (początek wrz. 2026).",meth_r5:"Weryfikacja: RWTH-EBC 2025-001 (DOI 10.18154/RWTH-2025-05335), ten sam produkt DE–UK: w granicach 3%.",meth_r6:"Kwoty wsparcia to obliczenia HeatPump DB z opublikowanych zasad — nie stwierdza się żadnej kwalifikowalności.",
 meth_src_h:"Źródła podstawowe",meth_s1:"Miara, M. (2026): Heat Pump Installation Costs: Germany vs. Europe. heatpumpswatch.org, 10.02.2026.",meth_s2:"Vering, Kühn, Maier, Müller (2025): Analyse der Endkundenpreise für Luft-Wasser-Wärmepumpen DE–UK. RWTH Aachen / Octopus Energy.",meth_s3:"Verbraucherzentrale RLP (2025): 160 ofert na pompy ciepła. Panel instalatorów ZVSHK (n = 1 121). Dokumenty ADEME, MCS, NFOŚiGW, GSE.",
 prop_kicker1:"Propozycje · 1 z 2", prop_kicker2:"Propozycje · 2 z 2", prop_dek2:"Dwa pozostałe rynki — i jedna nasza propozycja, jako uczestnika tego rynku.",
 p_why:"Dlaczego ta propozycja", p_DE_w:"Niemiecka luka nie leży w sprzęcie: cena pompy ciepła jest trzecia z pięciu (s. 4), ale montaż sięga <b>21 000 €</b> (s. 5), a nawet maksymalne dofinansowanie zostawia gospodarstwu <b>14 453 €</b> (s. 9). Więcej pieniędzy tego nie zamknie. W tym raporcie policzalne są dwie pozycje: <b>forma</b> dotacji i <b>19% VAT</b> — 5 437 € na tym zleceniu.", p_GB_w:"Wielka Brytania i tak jest najtańsza z pięciu — <b>11 829 €</b>, a stała dotacja zostawia tylko <b>3 084 €</b> (s. 9). Strona kosztowa jest rozwiązana, więc propozycja musi dotyczyć tego, co nie jest: lipcowych <b>8 150 wniosków wobec ok. 2 500 zrealizowanych bonów</b> oraz powrotu VAT z 0% do 5% w marcu 2027.", p_FR_w:"Francja ma <b>najniższą cenę pompy ciepła</b> z pięciu (6 352 €, s. 4) i drugi najniższy VAT — ale <b>drugi najwyższy koszt montażu</b> (9 500 €, s. 5). Ani cena, ani podatek nie są pozostałą dźwignią; jest nią montaż — i właśnie na to działa wrześniowe zaostrzenie.", p_PL_w:"Polska to jedyny rynek, na którym jedno zdanie zmienia sumę. Ma <b>najwyższą cenę pompy ciepła</b> z pięciu (8 630 €), a mimo to drugi najniższy rachunek (15 260 €), bo prace są opodatkowane stawką 8%. Stosowane dosłownie <b>23%</b> dałoby 17 380 € (s. 9).", p_IT_w:"Włochy to jedyny tutaj rynek bez publikowanej serii kosztów montażu: ich przedział montażowy (<b>2 435–11 526 €</b>, s. 5) jest ponad dwa razy szerszy niż brytyjski, bo trzeba go było wyprowadzić z portali komercyjnych różniących się dwukrotnie. Najszerszy słupek w raporcie to problem dowodów, nie kosztów.", p_us_w:"Powodem jest strona 10: w niemieckim rejestrze producenci azjatyccy dostarczają <b>426 modeli wobec 203</b> europejskich premium, a śledzona w raporcie pompa ciepła jest wszędzie zarejestrowana i kwalifikowalna — w tej samej cenie netto. Ograniczeniem nie jest dostępność, lecz widoczność w chwili decyzji.",
 mk_kicker:"Otwórz bazę", mk_title:"Każda wpisana pompa ciepła w Europie. Jedna baza.", mk_dek:"Katalog stojący za każdą liczbą w tym raporcie. Pięć rynków, jedna baza techniczna — przeszukiwalna w sekundy, porównywalna obok siebie, do wydruku jako karta gotowa do oferty. Wybierz rynek: zeskanuj kod lub kliknij kartę.", mk_open:"Otwórz", mk_models:"modeli", mk_free:"15 dni bezpłatnie — bez danych płatniczych.", mk_scan:"Zeskanuj kod aparatem telefonu albo kliknij kartę.", tag_DE:"Baza listy BAFA — dla instalatorów i projektantów.", tag_GB:"Towarzysz listy Ofgem PEL dla instalatorów MCS.", tag_FR:"Referencyjna baza PAC powietrze/woda dla profesjonalistów RGE.", tag_PL:"Baza pomp ciepła z potwierdzonym statusem ZUM.", tag_IT:"Baza ze statusem w katalogu GSE (Conto Termico).",
},

it:{special:"Report speciale",sources:"Fonti",prev:"Indietro",next:"Avanti",print:"Stampa / Salva PDF",fs:"Schermo intero",pageOf:"Pagina {a} di {b}",edition:"Edizione settembre 2026",

 read_kicker:"Come leggere questo report",read_title:"Non confrontiamo mercati. Seguiamo una pompa di calore.",read_dek:"Tre regole, applicate in ogni pagina che segue.",
 r1h:"Un prodotto, non una classe",r1p:"Ogni prezzo delle pagine seguenti riguarda una sola pompa di calore: Daikin Altherma 3 R F, 8 kW, accumulo 230 l — la pompa aria/acqua più venduta in Europa, né import economico né linea premium, registrata in tutti e cinque i registri nazionali. Non una «fascia 8–10 kW».",
 r2h:"Ogni euro ha un nome",r2p:"HeatPump DB non pubblica prezzi. I prezzi delle pompe di calore sono letti presso due fornitori per mercato, con lo stato IVA indicato nella pagina del fornitore. L’installazione viene dall’analisi di riferimento (Miara, heatpumpswatch.org, feb. 2026). Tutto ciò che calcoliamo noi è segnalato come tale.",
 r3h:"Gli intervalli si mostrano, i punti medi si usano",r3p:"Ogni costo nelle pagine seguenti è un intervallo, e i grafici mostrano l’intervallo. Per un dato confrontabile per paese prendiamo il punto medio aritmetico di quell’intervallo — mai il più basso né una cifra di richiamo — e lo diciamo sul grafico.",
 prod_kicker:"La pompa di calore di riferimento",prod_title:"La pompa di calore è la stessa",prod_dek:"Daikin Altherma 3 R F, 8 kW, accumulo integrato 230 l — la stessa voce in cinque registri nazionali, una sola specifica.",prod_rated:"Potenza nominale A2/W35",prod_scop:"SCOP",prod_ref:"Refrigerante",prod_noise:"Potenza sonora esterna",prod_reg:"Registrata · in lista · ammissibile",prod_note:"Niente in questa pagina cambia da paese a paese. Ciò che cambia da qui in poi non è la pompa di calore.",

 hp_chart:"Prezzo della pompa di calore per mercato, netto — barra = i due prezzi dei fornitori trovati · indicatore = punto medio usato",

 hp_callout:"2.278 € separano il mercato più economico dal più caro, e la Germania sta nel mezzo. Sulla pompa di calore in sé non esiste alcun sovrapprezzo tedesco.",
 in_kicker:"Installazione",in_title:"L’installazione no",in_dek:"Quanto costa installare quella stessa pompa di calore, al lordo delle tasse. Ogni barra è l’intervallo del costo installato del mercato secondo l’analisi di riferimento, meno il prezzo della pompa di calore in quel mercato; l’indicatore è il punto medio usato. Nessuna barra è un preventivo per un singolo lavoro.",
 in_chart:"Costo di installazione per mercato, netto — barra = intervallo dall’analisi di riferimento · indicatore = punto medio usato",
 in_k1:"Gran Bretagna → Germania",in_k1s:"4.250 € → 21.000 €, confrontando i punti medi",in_k2:"La sola installazione tedesca",in_k2s:"più dell’intero sistema installato — pompa di calore e manodopera — in ogni altro mercato",in_k3:"Quota della manodopera in Germania",in_k3v:"circa un terzo",in_k3s:"110 ore di tecnico × 60–70 € = 6.600–7.700 € su 21.000 €",
 in_why_h:"Ore più care, o più ore?",in_why_p:"Entrambe, e soprattutto una terza cosa: alla tariffa tedesca 110 ore di tecnico valgono 6.600–7.700 € — circa un terzo dei 21.000 €. Le stesse ore alla tariffa polacca costerebbero ancora 2.200–3.300 €, quindi la tariffa oraria spiega solo una parte minore del divario. Il resto è l’ambito di lavoro che la Germania richiede come standard: basamento gettato, allacciamento trifase con centralina di controllo rete, trattamento dell’acqua, bilanciamento idraulico e pratiche per l’incentivo (pagina seguente).",
 in_rate_chart:"Tariffa oraria installatore, cliente finale (€/h)",in_hours_note:"Le ore sono pubblicate solo per la Germania: 110 h per una pompa di calore contro 36 h per una caldaia a gas (panel ZVSHK, n = 1.121). Per i mercati di confronto l’analisi di riferimento documenta tempi più brevi, senza una cifra — perciò qui il confronto è fatto sulle tariffe, che sono documentate.",
 tot_kicker:"Il conto",tot_title:"Quanto paga la famiglia",tot_dek:"Pompa di calore più installazione, poi IVA sulla fornitura installata. È il numero sul preventivo, prima di ogni sostegno.",tot_chart:"Quanto paga la famiglia, EUR — pompa di calore · installazione · IVA",leg_hp:"Pompa di calore",leg_in:"Installazione",leg_vat:"IVA",

 br_kicker:"La differenza, voce per voce",br_title:"Cosa comprano i 22.224 € in più",br_dek:"Una famiglia britannica paga 11.829 € per questa installazione, una tedesca 34.053 €. La barra qui sotto sono i 22.224 € di differenza, divisi nelle sole tre cose che possono differire.",

 why_kicker:"Germania, voce per voce",why_title:"Perché 21.000 € sono credibili",why_dek:"Il costo di installazione tedesco scomposto secondo l’analisi di riferimento — panel installatori ZVSHK, preventivi Verbraucherzentrale RLP, RWTH Aachen.",why_chart:"Voci di installazione tedesche, intervallo EUR",
 why_i1:"Manodopera — 110 ore di tecnico × 60–70 €",why_i2:"Basamento (VDI 4645)",why_i3:"Elettrico — trifase 400 V, centralina §14a EnWG, smart meter",why_i4:"Idraulica, puffer, acqua VDI 2035, bilanciamento, pratiche incentivo",
 why_sum:"Le voci sommano a 15.000–22.000 € — il punto medio di 21.000 € usato nella pagina precedente vi rientra.",why_cmp:"Cosa i mercati di confronto non richiedono",

 vat_callout:"Un contributo fisso lascia alla famiglia britannica 3.084 €. Il 50% tedesco lascia 20.053 € — e persino il massimo del 70% lascia 14.453 €, oltre quattro volte la cifra britannica. Una percentuale della fattura premia una fattura più alta; un importo fisso no.",
 vat_note:"Calcolo HeatPump DB dalle regole pubblicate dei programmi; nessuna ammissibilità è affermata. La Polonia è omessa perché le sue fasce non si riducono a una cifra difendibile.",
 av_kicker:"Il nostro dato",av_title:"La pompa di calore meno cara è anche nella lista tedesca",av_dek:"Il livello dei prezzi tedesco è spesso spiegato con il dominio dei marchi premium. Il suo stesso registro dice altro: tra le pompe di calore aria/acqua 8–10 kW registrate in Germania per l’incentivo, i produttori asiatici forniscono il doppio dei modelli rispetto ai marchi premium europei.",
 av_chart:"Quota delle pompe di calore aria/acqua 8–10 kW registrate in ciascun paese",av_prem:"Marchi premium europei (Viessmann, Vaillant, Bosch, Stiebel Eltron)",av_asia:"Produttori asiatici (Daikin, Panasonic, LG, Midea …)",
 av_k1:"Nel registro tedesco",av_k1v:"426 vs 203",av_k1s:"modelli di marchi asiatici contro modelli premium europei, su 1.360 registrati in questa classe",
 av_k2:"La pompa di calore di questo report",av_k2v:"registrata",av_k2s:"La Daikin seguita per tutto il report è registrata, in lista e ammissibile in Germania — allo stesso prezzo netto di ovunque",
 av_k3:"Cosa questo grafico non è",av_k3v:"quota di mercato",av_k3s:"Sono quote di modelli registrati, non di unità vendute. Disponibilità non è quota di mercato.",
 av_callout:"La pompa di calore meno cara non manca in Germania. È registrata, in lista e ammissibile. L’inclinazione premium tedesca è un fatto su ciò che viene installato, non su ciò che si può comprare.",
 av_reg:"Registrata = presente nel catalogo nazionale di questa classe di potenza e ammissibile al programma di sostegno del mercato (catalogo HeatPump DB, 01/09/2026).",
 prop_kicker:"Proposte",prop_title:"Cosa dovrebbe cambiare",prop_dek:"Una proposta per mercato — e il dato di questo report che vi ha portato.",
 p_DE_h:"Cambiare la forma dell’incentivo, non l’importo",p_DE:"Una percentuale della fattura rende un preventivo più alto più conveniente per tutta la filiera; una somma fissa per kW toglie quell’incentivo senza costare un euro in più. La Germania è anche l’unica delle cinque all’aliquota IVA piena — l’aliquota ridotta che ogni vicino applica è la voce quantificata più grande. E il pacchetto §14a / 400 V, giusto in linea di principio, viene riprogettato a ogni cantiere; un pacchetto domestico standard risparmierebbe ore.",
 p_GB_h:"Il lato costi è risolto; il vincolo si è spostato",p_GB:"A luglio le domande BUS hanno toccato il record di 8.150, mentre i voucher riscossi sono rimasti intorno a 2.500, come ogni mese quest’anno. Più contributo non cambia questo; la capacità installativa sì. E l’IVA allo 0% torna al 5% il 31 marzo 2027 — un rincaro programmato di ~600 € su un lavoro da 12.000 €, proprio quando il volume deve accelerare verso 600.000 l’anno.",
 p_FR_h:"Qualità senza capacità è meno installazioni",p_FR:"La stretta del 1° settembre — omologazione europea obbligatoria, gas mantenuto escluso dalle ristrutturazioni complete — va nella direzione giusta. Abbinata alla capacità di certificazione alza il livello; da sola riduce il numero. La Francia combina già la seconda IVA più bassa con un contributo fisso. La struttura è solida.",
 p_PL_h:"Correggere una frase",p_PL:"La divisione 8% / 23% dipende dal fatto che l’unità stia dentro l’involucro dell’edificio. L’unità esterna di una pompa aria/acqua sta fuori per definizione. Tassare la configurazione normale della tecnologia al triplo dell’aliquota dell’eccezione è un artefatto redazionale, non una scelta politica. Senza, la Polonia diventa nettamente il mercato più economico d’Europa per questa installazione.",
 p_IT_h:"Il problema sono le evidenze, non il costo",p_IT:"Il secondo mercato d’Europa non ha una serie pubblicata affidabile dei costi installati; il suo livello di prezzo si stima solo da portali commerciali che divergono del doppio. Una serie di costi Assoclima o GSE — come pubblicano Verbraucherzentrale, MCS e ADEME — permetterebbe di fondare la politica italiana su una base anziché su un’impressione.",
 p_us_h:"HeatPump DB",p_us:"<b>Rendere visibile il registro.</b> La stessa pompa di calore, allo stesso prezzo netto, è registrata in ognuno di questi mercati. Il vincolo non è la disponibilità, ma la visibilità al momento della decisione e l’incentivo che guida il preventivo. Mettere il catalogo registrato davanti alla famiglia prima del preventivo è l’intervento meno costoso disponibile e non richiede alcuna legge.",p_us_d:"Trasparenza: è anche ciò che fa HeatPump DB. Valuta la proposta sapendolo.",
 meth_kicker:"Metodo",meth_title:"Metodo e fonti",meth_dek:"Ogni cifra di questo report risale a una fonte citata o a un calcolo che segnaliamo.",meth_th1:"Mercato",meth_th2:"Prezzo della pompa di calore — due fornitori, IVA letta in pagina",meth_th3:"Base installazione",meth_th4:"IVA",
 meth_hp_GB:"Infinity Solar UK (interna EHVH08SU23E6V, netto) + City Plumbing (esterna ERGA08EVA, netto); City Plumbing kit completo",meth_hp_PL:"amigo-krakow.com.pl · sklep.auroks.pl (lordo, 23%)",meth_hp_IT:"climatic.it · idraulica.it (IVA inclusa, 22%)",meth_hp_FR:"plombelecdistribution.com · maison-energy.com (TTC, 20%)",meth_hp_DE:"klimatik.de (kit) · ssd-armaturenshop.de + glo24.de / breeze24.com (incl. 19%)",
 meth_in_ref:"Miara 2026: intervallo del costo installato meno il punto medio della fascia apparecchio",meth_in_IT:"Portali italiani 10–20 k€ IVA inclusa (Enpal, Instapro, Homedeal, PrezziCosto), al netto del 10%, meno il prezzo della pompa di calore di riferimento",
 meth_rules_h:"Regole",meth_r1:"Un prodotto, una specifica, cinque registri (catalogo HeatPump DB 01/09/2026).",meth_r2:"Due fornitori per mercato; IVA letta nella pagina del fornitore; offerte superate scartate e annotate (kit UK serie D 2024, 8.400 £).",meth_r3:"I grafici mostrano l’intero intervallo rilevato; il dato confrontabile per paese è il suo punto medio aritmetico.",meth_r4:"Cambi: EUR/PLN 4,309 · GBP/EUR 1,166 (inizio set. 2026).",meth_r5:"Controprova: RWTH-EBC 2025-001 (DOI 10.18154/RWTH-2025-05335), stesso prodotto DE–UK: entro il 3%.",meth_r6:"Gli importi di sostegno sono calcoli HeatPump DB dalle regole pubblicate — nessuna ammissibilità è affermata.",
 meth_src_h:"Riferimenti principali",meth_s1:"Miara, M. (2026): Heat Pump Installation Costs: Germany vs. Europe. heatpumpswatch.org, 10/02/2026.",meth_s2:"Vering, Kühn, Maier, Müller (2025): Analyse der Endkundenpreise für Luft-Wasser-Wärmepumpen DE–UK. RWTH Aachen / Octopus Energy.",meth_s3:"Verbraucherzentrale RLP (2025): 160 preventivi di pompe di calore. Panel installatori ZVSHK (n = 1.121). Documenti ADEME, MCS, NFOŚiGW, GSE.",
 prop_kicker1:"Proposte · 1 di 2", prop_kicker2:"Proposte · 2 di 2", prop_dek2:"I due mercati restanti — e una proposta nostra, come partecipante a questo mercato.",
 p_why:"Perché questa proposta", p_DE_w:"Il divario tedesco non sta nell’hardware: il prezzo della pompa di calore è il terzo su cinque (p. 4), ma l’installazione arriva a <b>21.000 €</b> (p. 5) e persino il massimo incentivo lascia <b>14.453 €</b> alla famiglia (p. 9). Più denaro non lo chiude. Le voci quantificabili qui sono due: la <b>forma</b> dell’incentivo e l’<b>IVA al 19%</b> — 5.437 € su questo lavoro.", p_GB_w:"La Gran Bretagna è già la più economica delle cinque con <b>11.829 €</b>, e il contributo fisso lascia solo <b>3.084 €</b> (p. 9). Il lato costi è risolto, quindi la proposta deve affrontare ciò che non lo è: a luglio <b>8.150 domande contro ~2.500 voucher riscossi</b>, e il ritorno dell’IVA dallo 0 al 5% nel marzo 2027.", p_FR_w:"La Francia ha il <b>prezzo più basso</b> della pompa di calore fra le cinque (6.352 €, p. 4) e la seconda IVA più bassa — ma il <b>secondo costo di installazione più alto</b> (9.500 €, p. 5). Né il prezzo né la tassa sono la leva rimasta: lo è l’installazione, ed è esattamente ciò su cui agisce la stretta di settembre.", p_PL_w:"La Polonia è l’unico mercato in cui una sola frase muove il totale. Ha il <b>prezzo più alto</b> della pompa di calore fra le cinque (8.630 €) e comunque il secondo conto più basso (15.260 €), perché il lavoro è tassato all’8%. Applicato alla lettera, il <b>23%</b> lo porterebbe a 17.380 € (p. 9).", p_IT_w:"L’Italia è l’unico mercato qui senza una serie pubblicata dei costi installati: il suo intervallo di installazione (<b>2.435–11.526 €</b>, p. 5) è più del doppio di quello britannico, perché è stato ricavato da portali commerciali che divergono del doppio. La barra più larga del report è un problema di evidenze, non di costo.", p_us_w:"Il motivo è pagina 10: nel registro tedesco i produttori asiatici forniscono <b>426 modelli contro 203</b> premium europei, e la pompa di calore seguita in questo report è registrata e ammissibile ovunque, allo stesso prezzo netto. Il vincolo non è la disponibilità, ma la visibilità al momento della decisione.",
 mk_kicker:"Apri il database", mk_title:"Ogni pompa di calore in lista in Europa. Un solo database.", mk_dek:"Il catalogo dietro ogni cifra di questo report. Cinque mercati, una base tecnica — ricercabile in pochi secondi, confrontabile fianco a fianco, stampabile come scheda pronta per il preventivo. Scegli il mercato: scansiona il codice o clicca la scheda.", mk_open:"Apri", mk_models:"modelli", mk_free:"15 giorni gratis — senza dati di pagamento.", mk_scan:"Inquadra il codice con la fotocamera del telefono, oppure clicca una scheda.", tag_DE:"Il database della lista BAFA — per installatori e progettisti.", tag_GB:"Il compagno Ofgem PEL per gli installatori MCS.", tag_FR:"La base di riferimento delle PdC aria/acqua per i professionisti RGE.", tag_PL:"Il database delle pompe di calore con stato ZUM confermato.", tag_IT:"Il database con lo stato nel catalogo GSE (Conto Termico).",
}};

/* ════ charts — drawn at the element's own pixel size, so nothing is stretched ════ */
const AX="#d9e2ec", INK="#384b66", MUT="#6d7c92";
function wrapText(txt,maxChars,maxLines){maxLines=maxLines||2;const w=String(txt).split(" "),out=[];let cur="";
  w.forEach(word=>{if((cur+" "+word).trim().length>maxChars&&cur){out.push(cur);cur=word}else cur=(cur?cur+" ":"")+word});
  if(cur)out.push(cur);
  if(out.length>maxLines){const keep=out.slice(0,maxLines);keep[maxLines-1]=keep[maxLines-1].replace(/[,;:]$/,"")+"…";return keep}
  return out}
/** horizontal range bars: the range found, with the midpoint marked. */
function rangeRows(w,h,items,o){
  const labelW=o.labelW??150, valueW=o.valueW??(o.simple?86:132), padT=8, padB=22;
  const L=labelW, R=Math.max(L+40,w-valueW), x=v=>L+(R-L)*(v-o.min)/(o.max-o.min);
  const rows=items.length, avail=h-padT-padB, rowH=avail/rows;
  let s="";
  (o.ticks||[]).forEach(v=>{s+=`<line x1="${x(v)}" x2="${x(v)}" y1="${padT}" y2="${h-padB+4}" stroke="${AX}"/><text x="${x(v)}" y="${h-4}" text-anchor="middle" font-size="10.5" fill="${MUT}">${esc(o.fmt(v))}</text>`});
  items.forEach((it,i)=>{
    const cy=padT+rowH*i+rowH/2, bh=Math.min(24,rowH*0.42), x0=x(it.lo), x1=Math.max(x(it.hi),x0+6);
    const lines=wrapText(it.k,o.labelChars??24,o.labelLines??2), ly=cy+4-(lines.length-1)*7;
    s+=`<text x="${L-12}" y="${ly}" text-anchor="end" font-size="11.5" fill="#172c49" font-weight="700">${lines.map((l,j)=>`<tspan x="${L-12}" dy="${j?14:0}">${esc(l)}</tspan>`).join("")}</text>`;
    s+=`<rect class="bar" x="${x0}" y="${cy-bh/2}" width="${x1-x0}" height="${bh}" rx="5" fill="${it.color}" opacity=".85" data-tip="${esc(it.tip)}"/>`;
    if(it.mid!=null){const cx=x(it.mid),th=bh/2+7;
      s+=`<line x1="${cx}" x2="${cx}" y1="${cy-th}" y2="${cy+th}" stroke="#fff" stroke-width="5"/>`
        +`<line x1="${cx}" x2="${cx}" y1="${cy-th}" y2="${cy+th}" stroke="#10223e" stroke-width="2.5"/>`}
    if(o.simple){s+=`<text x="${R+10}" y="${cy+4}" font-size="11.5" fill="${INK}" font-weight="700">${esc(o.fmtV(it.lo))} – ${esc(o.fmtV(it.hi))}</text>`}
    else if(rowH<44){s+=`<text x="${R+10}" y="${cy+4}" font-size="11.5" fill="#172c49" font-weight="800">${esc(o.fmtV(it.mid))}`
        +`<tspan font-size="10" font-weight="400" fill="${MUT}">  (${esc(o.fmtV(it.lo))} – ${esc(o.fmtV(it.hi))})</tspan></text>`}
    else{s+=`<text x="${R+10}" y="${cy-1}" font-size="12.5" fill="#172c49" font-weight="800">${esc(o.fmtV(it.mid))}</text>`
        +`<text x="${R+10}" y="${cy+12}" font-size="10.5" fill="${MUT}">${esc(o.fmtV(it.lo))} – ${esc(o.fmtV(it.hi))}</text>`}
  });
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${s}</svg>`;
}
/** vertical stacked bars with the total on top. */
function stackedBars(w,h,items,o){
  const padL=54,padR=12,padT=22,padB=34, y=v=>padT+(h-padT-padB)*(1-v/o.max);
  const n=items.length, slot=(w-padL-padR)/n, bw=Math.min(slot*0.5,96);
  let s="";
  (o.ticks||[]).forEach(v=>{s+=`<line x1="${padL}" x2="${w-padR}" y1="${y(v)}" y2="${y(v)}" stroke="${AX}"/><text x="${padL-8}" y="${y(v)+4}" text-anchor="end" font-size="10.5" fill="${MUT}">${esc(o.fmt(v))}</text>`});
  items.forEach((it,i)=>{const x=padL+slot*i+(slot-bw)/2;let acc=0;
    it.parts.forEach((p,j)=>{if(p.v<=0)return;const y1=y(acc+p.v),y0=y(acc);
      s+=`<rect class="bar" x="${x}" y="${y1+(j?1:0)}" width="${bw}" height="${Math.max(y0-y1-(j?1:0),0)}" rx="${j===it.parts.length-1?4:0}" fill="${p.color}" data-tip="${esc(p.tip)}"/>`;acc+=p.v});
    s+=`<text x="${x+bw/2}" y="${y(acc)-7}" text-anchor="middle" font-size="12" fill="#172c49" font-weight="800">${esc(o.fmtV(acc))}</text>`
      +`<text x="${x+bw/2}" y="${h-padB+16}" text-anchor="middle" font-size="11" fill="${MUT}" font-weight="700">${esc(it.k)}</text>`});
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${s}</svg>`;
}
/** the gap, as one bar split into its components, with both endpoint totals named. */
function gapBar(w,h,o){
  const L=16,R=w-16, total=o.parts.reduce((a,p)=>a+p.v,0);
  const barH=Math.min(120,Math.max(66,h*0.34)), top=Math.round(h*0.52-barH/2);
  let s="",x=L;
  // endpoint captions
  s+=`<text x="${L}" y="20" font-size="21" fill="#172c49" font-weight="850">${esc(o.fromV)}</text>`
   + `<text x="${L}" y="37" font-size="11.5" fill="${MUT}">${esc(o.fromL)}</text>`
   + `<text x="${R}" y="20" text-anchor="end" font-size="21" fill="#172c49" font-weight="850">${esc(o.toV)}</text>`
   + `<text x="${R}" y="37" text-anchor="end" font-size="11.5" fill="${MUT}">${esc(o.toL)}</text>`;
  s+=`<text x="${(L+R)/2}" y="${top-12}" text-anchor="middle" font-size="12" fill="${MUT}" font-weight="700">${esc(o.gapLabel)}</text>`;
  o.parts.forEach(p=>{
    const wpx=Math.max((R-L)*p.v/total,5), cx=x+wpx/2, share=p.v/total*100;
    s+=`<rect class="bar" x="${x}" y="${top}" width="${wpx}" height="${barH}" fill="${p.color}" data-tip="${esc(p.tip)}"/>`;
    if(wpx>=120){
      s+=`<text x="${cx}" y="${top+barH/2-5}" text-anchor="middle" font-size="13" fill="#fff" font-weight="800">${esc(p.name)}</text>`
        +`<text x="${cx}" y="${top+barH/2+14}" text-anchor="middle" font-size="12.5" fill="#fff" opacity=".92">${esc(o.fmtV(p.v))} · ${esc(pct(Math.round(share*10)/10))}</text>`;
    }else{
      const ly=top+barH+30;
      s+=`<line x1="${cx}" x2="${cx}" y1="${top+barH}" y2="${ly-16}" stroke="#94a3b8"/>`
        +`<text x="${cx}" y="${ly-3}" text-anchor="middle" font-size="11.5" fill="#172c49" font-weight="700">${esc(p.name)}</text>`
        +`<text x="${cx}" y="${ly+12}" text-anchor="middle" font-size="11" fill="${MUT}">${esc(o.fmtV(p.v))} · ${esc(pct(Math.round(share*10)/10))}</text>`;
    }
    x+=wpx});
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${s}</svg>`;
}
/** two bars per category — before / after, or two shares. */
function groupedBars(w,h,items,o){
  const padL=54,padR=12,padT=22,padB=o.padB??42, y=v=>padT+(h-padT-padB)*(1-v/o.max);
  const n=items.length, slot=(w-padL-padR)/n, bw=Math.min(slot*0.3,54), gap=5;
  let s="";
  (o.ticks||[]).forEach(v=>{s+=`<line x1="${padL}" x2="${w-padR}" y1="${y(v)}" y2="${y(v)}" stroke="${AX}"/><text x="${padL-8}" y="${y(v)+4}" text-anchor="end" font-size="10.5" fill="${MUT}">${esc(o.fmt(v))}</text>`});
  items.forEach((it,i)=>{const cx=padL+slot*i+slot/2, yA=y(it.a), yB=y(it.b), tight=Math.abs(yA-yB)<17;
    [[it.a,it.ca,it.ta,-1,tight?yA-14:yA-6],[it.b,it.cb,it.tb,1,yB-6]].forEach(([v,c,tip,side,ly])=>{
      const x=cx+(side<0?-bw-gap/2:gap/2), y1=y(v);
      s+=`<rect class="bar" x="${x}" y="${y1}" width="${bw}" height="${Math.max(y(0)-y1,1)}" rx="4" fill="${c}" data-tip="${esc(tip)}"/>`
        +`<text x="${x+bw/2}" y="${ly}" text-anchor="middle" font-size="11.5" fill="#172c49" font-weight="800">${esc(o.fmtV(v))}</text>`});
    const lines=wrapText(it.k,o.labelChars??16,o.labelLines??2);
    s+=`<text x="${cx}" y="${h-padB+15}" text-anchor="middle" font-size="10.5" fill="${MUT}" font-weight="700">${lines.map((l,j)=>`<tspan x="${cx}" dy="${j?12.5:0}">${esc(l)}</tspan>`).join("")}</text>`});
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${s}</svg>`;
}

  case "total":return pageShell(p,idx,head(t('tot_kicker'),t('tot_title'),t('tot_dek'),idx),
    chartBox(t('tot_chart'),"total","",legend([["#10223e",t('leg_hp')],["#35c6a2",t('leg_in')],["#e2a400",t('leg_vat')]]))
    +`<div class="kpi3">${metricCard(t('tot_k1'),"× 2.88",`${eur(DATA.pays.DE)} ÷ ${eur(DATA.pays.GB)}`)}${metricCard(t('tot_k2'),eur(DATA.gap.total),`${M('DE')} − ${M('GB')}`)}${metricCard(t('tot_k3'),esc(t('tot_k3v')),t('tot_k3s'))}</div>`);

  case "bridge":return pageShell(p,idx,head(t('br_kicker'),t('br_title'),t('br_dek'),idx),
    chartBox(t('br_chart'),"gap")
    +`<div class="kpi3">${metricCard(t('br_k1'),"+"+eur(DATA.gap.hp),t('br_k1s'))}${metricCard(t('br_k2'),"+"+eur(DATA.gap.inst),t('br_k2s'))}${metricCard(t('br_k3'),"+"+eur(DATA.gap.vat),t('br_k3s'))}</div>`
    +`<div class="callout">${esc(t('br_callout'))}</div>`);

  case "why":return pageShell(p,idx,head(t('why_kicker'),t('why_title'),t('why_dek'),idx),
    `<div class="grid2"><div>${chartBox(t('why_chart'),"why")}<div class="callout warn">${esc(t('why_sum'))}</div></div>
      <div class="card cmp-card"><h3>${esc(t('why_cmp'))}</h3><div class="cmp-list">${[1,2,3].map(i=>`<div class="cmp-item"><div class="n">${i}</div><div>${esc(t('why_c'+i))}</div></div>`).join("")}</div>
        <div class="rate">${chartBox(t('in_rate_chart'),"rate")}</div></div></div>`);

  case "vat":{
    const rows=ORDER.map(cc=>{const f=cc==="DE"?["form-prop","form_prop"]:(cc==="PL"||cc==="FR")?["form-band","form_band"]:["form-fixed","form_fixed"];
      return `<tr><td><b>${esc(M(cc))}</b></td><td>${esc(t('vat_'+cc))}</td><td>${esc(t('sub_'+cc))}</td><td><span class="${f[0]}">${esc(t(f[1]))}</span></td></tr>`}).join("");
    return pageShell(p,idx,head(t('vat_kicker'),t('vat_title'),t('vat_dek'),idx),
      `<div class="grid2"><table class="table vat-table"><thead><tr><th>${esc(t('vat_th1'))}</th><th>${esc(t('vat_th2'))}</th><th>${esc(t('vat_th3'))}</th><th>${esc(t('vat_th4'))}</th></tr></thead><tbody>${rows}</tbody></table>
        <div>${chartBox(t('vat_chart'),"after","",legend([["#c8d3e0",t('leg_before')],["#35c6a2",t('leg_after')]]))}
        <div><div class="callout danger">${esc(t('vat_callout'))}</div><div class="note" style="margin-top:8px">${esc(t('vat_note'))}</div></div></div></div>`)}

  case "availability":return pageShell(p,idx,head(t('av_kicker'),t('av_title'),t('av_dek'),idx),
    chartBox(t('av_chart'),"avail","",legend([["#8493a8",t('av_prem')],["#35c6a2",t('av_asia')]]))
    +`<div class="kpi3">${metricCard(t('av_k1'),esc(t('av_k1v')),t('av_k1s'))}${metricCard(t('av_k2'),esc(t('av_k2v')),t('av_k2s'))}${metricCard(t('av_k3'),esc(t('av_k3v')),t('av_k3s'))}</div>`
    +`<div class="callout">${esc(t('av_callout'))}<div class="note" style="margin-top:6px">${esc(t('av_reg'))}</div></div>`);

  case "proposals":{
    const row=(mark,name,title,text,why,accent,cls="")=>`<div class="prow ${cls}" style="--m:${accent}">
      <div class="pmarket">${mark}<b>${esc(name)}</b></div>
      <div><div class="ptitle">${esc(title)}</div><div class="ptext">${esc(text)}</div></div>
      <div class="pwhy"><div class="pwhylabel">${esc(t('p_why'))}</div><div class="ptext">${why}</div></div></div>`;
    const ccs=p.set===2?["PL","IT"]:["DE","GB","FR"];
    const fl=cc=>(BRAND.markets.find(x=>x.cc===cc)||{}).flag||"";
    const rows=ccs.map(cc=>row(
      `<span class="pflagwrap">${fl(cc)}</span>`, M(cc), t('p_'+cc+'_h'), t('p_'+cc), t('p_'+cc+'_w'), MARKETS[cc].accent)).join("");
    const usT=(t('p_us').match(/^<b>([^<]*)<\/b>/)||[,t('mk_kicker')])[1].replace(/[.·]\s*$/,"");
    const usB=t('p_us').replace(/^<b>[^<]*<\/b>\s*/,"");
    const us=`<div class="prow us" style="--m:#071731">
      <div class="pmarket"><span class="pusmark"><svg viewBox="0 0 64 64" fill="none" aria-hidden="true" style="--hp-db-a:${BRAND.colors.red};--hp-db-b:${BRAND.colors.blue}">${BRAND.logoDark.replace(/<text[\s\S]*?<\/text>/,"")}</svg></span><b>${esc(t('p_us_h'))}</b></div>
      <div><div class="ptitle">${esc(usT)}</div><div class="ptext">${usB}</div></div>
      <div class="pwhy"><div class="pwhylabel">${esc(t('p_why'))}</div><div class="ptext">${t('p_us_w')}<small class="pdisc">${esc(t('p_us_d'))}</small></div></div></div>`;
    return pageShell(p,idx,head(t(p.set===2?'prop_kicker2':'prop_kicker1'),t('prop_title'),t(p.set===2?'prop_dek2':'prop_dek'),idx),
      `<div class="proplist">${rows}${p.set===2?us:""}</div>`)}

  case "method":{
    const rows=ORDER.map(cc=>`<tr><td><b>${esc(M(cc))}</b></td><td>${esc(t('meth_hp_'+cc))}</td><td>${esc(cc==="IT"?t('meth_in_IT'):t('meth_in_ref'))}</td><td>${pct(DATA.vat[cc])}</td></tr>`).join("");
    return pageShell(p,idx,head(t('meth_kicker'),t('meth_title'),t('meth_dek'),idx),
      `<div class="grid2" style="grid-template-columns:1.25fr .75fr"><table class="table meth-table"><thead><tr><th>${esc(t('meth_th1'))}</th><th>${esc(t('meth_th2'))}</th><th>${esc(t('meth_th3'))}</th><th>${esc(t('meth_th4'))}</th></tr></thead><tbody>${rows}</tbody></table>
        <div style="display:grid;gap:12px;align-content:start"><div class="card"><h3 style="font-size:15px">${esc(t('meth_rules_h'))}</h3><div class="rules-list">${[1,2,3,4,5,6].map(i=>`<div><b>${i}</b><span>${esc(t('meth_r'+i))}</span></div>`).join("")}</div></div>
        <div class="card soft"><h3 style="font-size:15px">${esc(t('meth_src_h'))}</h3><div class="rules-list">${[1,2,3].map(i=>`<div><b>·</b><span>${esc(t('meth_s'+i))}</span></div>`).join("")}</div></div></div></div>`)}
  case "market":{
    const cards=BRAND.markets.map(m=>`<a class="mcard" href="${m.url}" target="_blank" rel="noopener">
      <div class="mtop">${m.flag}<div><div class="mname">${esc(m.name)}</div><span class="mhost">${esc(m.host)}</span></div></div>
      <p class="mtag">${esc(t('tag_'+m.cc))}</p>
      <div class="mmeta"><span class="mchip">${esc(m.chip)}</span><span class="mmodels">${esc(m.models)}<em>${esc(t('mk_models'))}</em></span></div>
      <div class="mfoot"><span class="mcta">${esc(t('mk_open'))} ${esc(m.host)} →</span><span class="qr-tile">${m.qr}</span></div></a>`).join("");
    const cta=`<div class="mcard mcta-tile"><svg class="ctalogo" viewBox="0 0 348 64" fill="none" aria-hidden="true" style="--hp-db-a:${BRAND.colors.red};--hp-db-b:${BRAND.colors.blue}">${BRAND.logoDark}</svg>
      <div class="ctafree">${esc(t('mk_free'))}</div><div class="ctascan">${esc(t('mk_scan'))}</div><div class="ctahost">www.heatpumpdb.eu</div></div>`;
    return pageShell(p,idx,head(t('mk_kicker'),t('mk_title'),t('mk_dek'),idx),
      `<div class="mgrid">${cards}${cta}</div>
       <div class="mnote"><span>${esc(t('special'))} · 09/2026 · HeatPump DataBase Europe</span><span class="mwm">${esc(t('mk_scan'))}</span></div>`)}
  }
  return "";
}
/* ════ controls ════ */
const tip=document.getElementById("tip");
function wireTips(root){(root||document).querySelectorAll("[data-tip]").forEach(el=>{
  if(el.__tipped)return; el.__tipped=1;
  el.addEventListener("mousemove",e=>{tip.textContent=el.getAttribute("data-tip");tip.style.opacity=1;tip.style.left=e.clientX+"px";tip.style.top=e.clientY+"px"});
  el.addEventListener("mouseleave",()=>tip.style.opacity=0)})}
function drawOne(el,force){
  const f=CHART[el.dataset.c]; if(!f)return;
  const w=Math.round(el.clientWidth), h=Math.round(el.clientHeight);
  if(w<80||h<60)return;                      /* 측정 불가 상태에서는 기존 그림을 지우지 않는다 */
  if(!force&&el.__w===w&&el.__h===h&&el.__lang===lang)return;
  el.__w=w;el.__h=h;el.__lang=lang;
  el.innerHTML=f(w,h); wireTips(el)}
function drawCharts(force){document.querySelectorAll(".cv[data-c]").forEach(el=>drawOne(el,force))}
/* The chart is drawn at its container's pixel size, so the container must be
   observed directly: a media-query reflow, a font load or a flex settle can
   resize it without a window resize event, and a chart left at a stale size
   never recovers on its own. */
const RO=typeof ResizeObserver!=="undefined"?new ResizeObserver(es=>{
  if(RO.__raf)cancelAnimationFrame(RO.__raf);
  const els=es.map(e=>e.target);
  RO.__raf=requestAnimationFrame(()=>{els.forEach(el=>drawOne(el,false))});
}):null;
function observeCharts(){if(!RO)return;document.querySelectorAll(".cv[data-c]").forEach(el=>RO.observe(el))}
function buildPages(){
  document.getElementById("book").innerHTML=PAGES.map((p,i)=>renderContent(p,i)).join("");
  document.getElementById("brandLogo").innerHTML=`<svg class="brandlogo" viewBox="0 0 348 64" fill="none" role="img" aria-label="HeatPump DB" style="--hp-db-a:${BRAND.colors.red};--hp-db-b:${BRAND.colors.blue}">${BRAND.logoDark}</svg>`;
  document.getElementById("editionLabel").textContent=t('edition');
  document.getElementById("printBtn").textContent=t('print');
  document.getElementById("fsBtn").textContent=t('fs');
  document.getElementById("prevBtn").textContent="‹ "+t('prev');
  document.getElementById("nextBtn").textContent=t('next')+" ›";
  document.documentElement.lang=lang;document.getElementById("lang").value=lang;
  wireTips(); updatePage();
  if(RO)RO.disconnect();
  requestAnimationFrame(()=>{drawCharts(true);observeCharts();requestAnimationFrame(()=>drawCharts(true))});
}
function updatePage(){
  const pages=[...document.querySelectorAll(".page")];
  pages.forEach((pg,i)=>{pg.classList.remove("active","old-left","old-right");
    if(i===current)pg.classList.add("active");else if(i<current)pg.classList.add("old-left");else pg.classList.add("old-right")});
  document.getElementById("progressFill").style.width=((current+1)/PAGES.length*100)+"%";
  document.getElementById("pagecount").textContent=t('pageOf').replace("{a}",current+1).replace("{b}",PAGES.length);
  document.getElementById("prevBtn").disabled=current===0;
  document.getElementById("nextBtn").disabled=current===PAGES.length-1;
  document.getElementById("navL").classList.toggle("disabled",current===0);
  document.getElementById("navR").classList.toggle("disabled",current===PAGES.length-1);
  const u=new URL(location.href);u.searchParams.set("page",current+1);u.searchParams.set("lang",lang);history.replaceState(null,"",u);
}
function go(d){const n=current+d;if(n<0||n>=PAGES.length)return;current=n;updatePage();requestAnimationFrame(()=>drawCharts(true))}
document.getElementById("prevBtn").onclick=()=>go(-1);document.getElementById("nextBtn").onclick=()=>go(1);
document.getElementById("navL").onclick=()=>go(-1);document.getElementById("navR").onclick=()=>go(1);
document.getElementById("lang").onchange=e=>{lang=e.target.value;try{localStorage.setItem("sr2609lang",lang)}catch(_){}buildPages()};
document.getElementById("printBtn").onclick=()=>window.print();
document.getElementById("fsBtn").onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()};
document.addEventListener("keydown",e=>{if(e.key==="ArrowRight"||e.key==="PageDown"||e.key===" ")go(1);else if(e.key==="ArrowLeft"||e.key==="PageUp")go(-1);else if(e.key==="Home"){current=0;updatePage();drawCharts()}else if(e.key==="End"){current=PAGES.length-1;updatePage();drawCharts()}});
let tx0=null;const bk=document.getElementById("book");
bk.addEventListener("touchstart",e=>{tx0=e.touches[0].clientX},{passive:true});
bk.addEventListener("touchend",e=>{if(tx0==null)return;const dx=e.changedTouches[0].clientX-tx0;if(Math.abs(dx)>50)go(dx<0?1:-1);tx0=null});
let rt;addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(()=>drawCharts(true),140)});
addEventListener("beforeprint",()=>drawCharts(true));
addEventListener("afterprint",()=>drawCharts(true));
buildPages();
setTimeout(()=>drawCharts(true),60);setTimeout(()=>drawCharts(true),420);setTimeout(()=>drawCharts(true),1200);

</script>
